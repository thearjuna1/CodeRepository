spring.application.name=codenest
server.port=8080
spring.data.mongodb.uri=mongodb://localhost:27017/PBL5?serverSelectionTimeoutMS=5000
spring.data.mongodb.auto-index-creation=true
codenest.jwt.secret=CodeNestLocalDevSecretKey2026_OnlyForLocalDevelopment_ChangeForProduction
codenest.jwt.access-token-minutes=15
codenest.jwt.refresh-token-days=14
codenest.cookie.name=codenest_refresh
codenest.cookie.path=/api/auth
codenest.cookie.secure=false
codenest.cookie.same-site=Lax
codenest.cors.allowed-origins=http://localhost:8080
codenest.learning.timezone=Asia/Kolkata
codenest.seed.enabled=true
codenest.admin.name=CodeNest Admin
codenest.admin.email=admin@codenest.local
codenest.admin.password=CodeNestAdminLocal2026!
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.level.org.springframework.security=WARN