<script>
    (() => {
      'use strict';
      const CN = window.CN;
      const { state, esc, enc, $, $$, icon, toast, setBusy, setView, setTitle, api, stale, onLeave,
              fmtDate, fmtDateTime, relTime, ring, bar, emptyHtml, errorHtml } = CN;

      const lessonHref = (id) => '#/lesson/' + enc(id);
      const courseHref = (id) => '#/course/' + enc(id);
      const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

      /* ======================= form helpers (shared by login and registration) ======================= */
      function fieldHtml({ id, name, label, type = 'text', autocomplete = '', maxlength = '', hint = '' }) {
        return `<div class="field">
          <label for="${id}">${esc(label)}</label>
          <input id="${id}" name="${name}" type="${type}" autocomplete="${autocomplete}" ${maxlength ? `maxlength="${maxlength}"` : ''} aria-describedby="${id}-err">
          ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
          <div class="field-error" id="${id}-err" data-error-for="${name}" aria-live="polite"></div>
        </div>`;
      }
      const value = (form, name) => { const el = form.elements.namedItem(name); return el ? el.value : ''; };

      function clearErrors(form) {
        $$('.field', form).forEach((f) => f.classList.remove('invalid'));
        $$('[data-error-for]', form).forEach((e) => { e.textContent = ''; });
        const fe = $('[data-form-error]', form);
        if (fe) { fe.className = 'hidden'; fe.textContent = ''; }
      }
      function showErrors(form, errors) {
        let first = null;
        Object.entries(errors).forEach(([name, message]) => {
          const slot = $(`[data-error-for="${name}"]`, form);
          if (!slot) return;
          slot.textContent = message;
          const wrap = slot.closest('.field'); if (wrap) wrap.classList.add('invalid');
          const input = form.elements.namedItem(name);
          if (input && !first) first = input;
        });
        if (first) first.focus();
      }
      /** Shows an error from the server: per-field messages where possible, otherwise one message above the form. */
      function showServerError(form, err) {
        if (err.fieldErrors) {
          showErrors(form, err.fieldErrors);
          if (Object.keys(err.fieldErrors).some((k) => $(`[data-error-for="${k}"]`, form))) return;
        }
        const fe = $('[data-form-error]', form);
        fe.className = 'flash flash-error';
        fe.setAttribute('role', 'alert');
        fe.textContent = err.message || 'Something went wrong. Please try again.';
      }
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      /* ======================= login ======================= */
      CN.routes.login = async () => {
        setTitle('Sign in');
        const flash = state.flash; state.flash = null;
        const resuming = !!state.returnTo && !flash;
        CN.mountGuest(`
          <h1>Welcome back</h1>
          <p class="muted">Sign in to continue learning Java.</p>
          ${flash ? `<div class="flash flash-${esc(flash.type || 'info')}" role="status">${esc(flash.message)}</div>` : ''}
          ${resuming ? '<div class="flash flash-info" role="status">Sign in to pick up where you left off. Your progress is saved.</div>' : ''}
          <form data-form="login" novalidate>
            <div data-form-error class="hidden"></div>
            ${fieldHtml({ id: 'login-email', name: 'email', label: 'Email', type: 'email', autocomplete: 'email', maxlength: 120 })}
            ${fieldHtml({ id: 'login-password', name: 'password', label: 'Password', type: 'password', autocomplete: 'current-password', maxlength: 72 })}
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
          </form>
          <p class="auth-foot center">New to CodeNest? <a href="#/register">Create an account</a></p>`);
        const email = $('#login-email'); if (email) email.focus();
      };

      CN.forms.login = async (form) => {
        clearErrors(form);
        const email = value(form, 'email').trim();
        const password = value(form, 'password');
        const errors = {};
        if (!EMAIL_RE.test(email)) errors.email = 'Enter a valid email address.';
        if (!password) errors.password = 'Enter your password.';
        if (Object.keys(errors).length) { showErrors(form, errors); return; }

        const btn = $('button[type=submit]', form);
        setBusy(btn, true, 'Signing in…');
        try {
          const data = await api('/api/auth/login', { method: 'POST', body: { email, password }, noAuth: true });
          CN.applySession(data);
          CN.finishLogin();                                   // loads the saved learning state from the server
        } catch (err) {
          setBusy(btn, false);
          showServerError(form, err);
        }
      };

      /* ======================= registration ======================= */
      CN.routes.register = async () => {
        setTitle('Create account');
        CN.mountGuest(`
          <h1>Create your account</h1>
          <p class="muted">Free to join. Your progress is saved to your account, so you can pick up on any device.</p>
          <form data-form="register" novalidate>
            <div data-form-error class="hidden"></div>
            ${fieldHtml({ id: 'reg-name', name: 'name', label: 'Full name', autocomplete: 'name', maxlength: 60 })}
            ${fieldHtml({ id: 'reg-email', name: 'email', label: 'Email', type: 'email', autocomplete: 'email', maxlength: 120 })}
            ${fieldHtml({ id: 'reg-password', name: 'password', label: 'Password', type: 'password', autocomplete: 'new-password', maxlength: 72, hint: 'At least 8 characters.' })}
            ${fieldHtml({ id: 'reg-confirm', name: 'confirm', label: 'Confirm password', type: 'password', autocomplete: 'new-password', maxlength: 72 })}
            <button type="submit" class="btn btn-primary btn-block">Create account</button>
          </form>
          <p class="auth-foot center">Already have an account? <a href="#/login">Sign in</a></p>`);
        const name = $('#reg-name'); if (name) name.focus();
      };

      CN.forms.register = async (form) => {
        clearErrors(form);
        const name = value(form, 'name').trim();
        const email = value(form, 'email').trim();
        const password = value(form, 'password');
        const confirm = value(form, 'confirm');
        const errors = {};
        if (name.length < 2 || name.length > 60) errors.name = 'Enter your name (2 to 60 characters).';
        if (!EMAIL_RE.test(email) || email.length > 120) errors.email = 'Enter a valid email address.';
        if (password.length < 8) errors.password = 'Use at least 8 characters.';
        else if (new TextEncoder().encode(password).length > 72) errors.password = 'That password is too long (72 bytes maximum).';
        if (confirm !== password) errors.confirm = 'The passwords do not match.';
        if (Object.keys(errors).length) { showErrors(form, errors); return; }

        const btn = $('button[type=submit]', form);
        setBusy(btn, true, 'Creating account…');
        try {
          const data = await api('/api/auth/register', { method: 'POST', body: { name, email, password }, noAuth: true });
          CN.applySession(data);
          toast('Welcome to CodeNest, ' + name.split(' ')[0] + '!', 'success');
          CN.finishLogin();
        } catch (err) {
          setBusy(btn, false);
          if (err.status === 409) showErrors(form, { email: err.message });
          else showServerError(form, err);
        }
      };

      /* ======================= dashboard ======================= */
      const ACTIVITY_ICON = { LESSON_COMPLETED: 'check', QUIZ_COMPLETED: 'book', ACHIEVEMENT_EARNED: 'trophy' };

      function resumeBlock(r) {
        if (!r || !r.lessonId) {
          return `<div><h2>No lessons available yet</h2><p class="muted mb0">Courses will appear here as soon as they are published.</p></div>`;
        }
        if (r.started) {
          return `<div>
            <span class="badge badge-accent">Continue learning</span>
            <h2 class="mt">${esc(r.lessonTitle)}</h2>
            <p class="muted">${esc(r.courseTitle)} · last visited ${esc(relTime(r.lastVisitedAt))}</p>
            <a class="btn btn-primary" href="${lessonHref(r.lessonId)}">Continue learning ${icon('arrowRight')}</a>
          </div>`;
        }
        return `<div>
          <span class="badge badge-accent">Start here</span>
          <h2 class="mt">${esc(r.lessonTitle)}</h2>
          <p class="muted">${esc(r.courseTitle)} · a good first lesson for beginners</p>
          <a class="btn btn-primary" href="${lessonHref(r.lessonId)}">Start your first lesson ${icon('arrowRight')}</a>
        </div>`;
      }

      function weeklyChart(days) {
        if (!days || !days.length) return '<p class="muted">No activity yet.</p>';
        const max = Math.max(1, ...days.map((d) => d.count));
        const cols = days.map((d) => {
          const label = new Date(d.day + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short' });
          const h = d.count === 0 ? 4 : Math.max(10, Math.round((d.count / max) * 92));
          return `<div class="col"><span class="small muted">${d.count}</span><div class="barv ${d.count === 0 ? 'zero' : ''}" style="height:${h}px" title="${esc(label)}: ${d.count}"></div><small>${esc(label)}</small></div>`;
        }).join('');
        return `<div class="week" role="img" aria-label="Lessons and quizzes completed on each of the last 7 days">${cols}</div>`;
      }

      function renderDashboard(d) {
        const first = String((state.user && state.user.name) || d.name || 'there').trim().split(/\s+/)[0];
        const o = d.overall || { totalLessons: 0, completedLessons: 0, percent: 0, totalPoints: 0, quizzesCompleted: 0, courses: [] };
        const s = d.streak || { currentStreak: 0, longestStreak: 0, totalLearningDays: 0, activeToday: false };

        const streakNote = s.activeToday ? 'You have learned today. Nice work!'
          : s.currentStreak > 0 ? 'Complete a lesson or quiz today to keep your streak alive.'
          : 'Complete a lesson or quiz to start a streak.';

        const courseRows = (o.courses || []).length
          ? o.courses.map((c) => `<li class="list-item" style="display:block">
              <div class="row-between"><a href="${courseHref(c.courseId)}"><b>${esc(c.courseTitle)}</b></a><span class="small muted">${c.completedLessons} of ${c.totalLessons} lessons</span></div>
              <div class="mt" style="margin-top:8px">${bar(c.percent)}</div></li>`).join('')
          : '';

        const activity = (d.recentActivity || []).length
          ? d.recentActivity.map((a) => `<li class="list-item"><span class="row" style="flex-wrap:nowrap">${icon(ACTIVITY_ICON[a.type] || 'check')}<span>${esc(a.title)}</span></span><span class="small muted right">${a.points > 0 ? '+' + a.points + ' pts · ' : ''}${esc(relTime(a.occurredAt))}</span></li>`).join('')
          : '';

        const quizzes = (d.recentQuizzes || []).length
          ? d.recentQuizzes.slice(0, 5).map((q) => `<li class="list-item"><a href="#/attempt/${enc(q.id)}">${esc(q.quizTitle)}</a><span class="row"><span class="badge ${q.passed ? 'badge-ok' : 'badge-warn'}">${q.scorePercent}%</span><span class="small muted">${esc(fmtDate(q.attemptedAt))}</span></span></li>`).join('')
          : '';

        const marks = (d.bookmarks || []).length
          ? d.bookmarks.map((b) => `<li class="list-item"><a href="${lessonHref(b.lessonId)}">${icon('bookmark', 16)} ${esc(b.lessonTitle)}</a><span class="small muted">${esc(b.courseTitle)}</span></li>`).join('')
          : '';

        const achievements = (d.achievements || []).map((a) => `
          <div class="achv ${a.earned ? '' : 'locked'}">
            <span class="medal">${icon('trophy', 20)}</span>
            <div><b>${esc(a.title)}</b><small>${a.earned ? 'Earned ' + esc(fmtDate(a.awardedAt)) + ' · +' + a.points + ' pts' : esc(a.description)}</small></div>
          </div>`).join('');
        const earned = (d.achievements || []).filter((a) => a.earned).length;

        return `
          <section class="card hero" aria-label="Continue learning">
            <div class="stack" style="gap:6px">
              <h1>${o.completedLessons > 0 ? 'Welcome back' : 'Welcome'}, ${esc(first)}</h1>
              ${resumeBlock(d.resume)}
            </div>
            <div class="row" style="gap:18px">
              ${ring(o.percent)}
              <div><b style="font-size:1.1rem">${o.completedLessons} of ${o.totalLessons}</b><div class="muted small">lessons completed</div></div>
            </div>
          </section>

          <section class="grid grid-4 mt" aria-label="Your numbers">
            <div class="stat"><b>${o.totalPoints}</b><span>Learning points</span></div>
            <div class="stat"><b>${icon('flame', 22)} ${s.currentStreak}</b><span>Day streak</span></div>
            <div class="stat"><b>${s.longestStreak}</b><span>Longest streak · ${s.totalLearningDays} learning days</span></div>
            <div class="stat"><b>${o.quizzesCompleted}</b><span>Quizzes taken</span></div>
          </section>
          <p class="muted small" style="margin:8px 4px 0">${esc(streakNote)}</p>

          <section class="grid grid-2 mt-lg">
            <div class="card"><h2>This week</h2><p class="muted small">Lessons and quizzes completed per day</p>${weeklyChart(d.weekly)}</div>
            <div class="card"><div class="row-between"><h2 class="mb0">Course progress</h2><a class="small" href="#/progress">Details</a></div>
              ${courseRows ? `<ul class="list mt">${courseRows}</ul>` : emptyHtml('No courses yet', 'Published courses will appear here.')}</div>
          </section>

          <section class="grid grid-2 mt">
            <div class="card"><h2>Recent activity</h2>
              ${activity ? `<ul class="list">${activity}</ul>` : '<p class="muted mb0">Nothing yet. Complete a lesson or take a quiz and it will show up here.</p>'}</div>
            <div class="card"><div class="row-between"><h2 class="mb0">Quiz scores</h2><a class="small" href="#/quizzes">All quizzes</a></div>
              ${quizzes ? `<ul class="list mt">${quizzes}</ul>` : '<p class="muted mt mb0">You have not taken a quiz yet. <a href="#/quizzes">Try one</a>.</p>'}</div>
          </section>

          <section class="grid grid-2 mt">
            <div class="card"><div class="row-between"><h2 class="mb0">Bookmarks</h2><a class="small" href="#/bookmarks">View all</a></div>
              ${marks ? `<ul class="list mt">${marks}</ul>` : '<p class="muted mt mb0">Use the Bookmark button on a lesson to save it here for later.</p>'}</div>
            <div class="card"><h2>Achievements</h2><p class="muted small">${earned} of ${(d.achievements || []).length} earned</p>
              <div class="stack" style="gap:10px">${achievements}</div></div>
          </section>`;
      }

      CN.routes.dashboard = async (args, id) => {
        setTitle('Dashboard');
        const data = await api('/api/dashboard');
        if (stale(id)) return;
        setView(renderDashboard(data));

        // When the background save queue finishes, quietly refresh the numbers.
        const refresh = async () => {
          if (stale(id)) return;
          try { const fresh = await api('/api/dashboard'); if (!stale(id)) setView(renderDashboard(fresh)); } catch (e) { /* keep what is shown */ }
        };
        window.addEventListener('cn:synced', refresh);
        onLeave(() => window.removeEventListener('cn:synced', refresh));
      };

      /* ======================= course list ======================= */
      CN.routes.courses = async (args, id) => {
        setTitle('Courses');
        const [courses, overall] = await Promise.all([api('/api/courses'), api('/api/progress')]);
        if (stale(id)) return;
        const prog = new Map((overall.courses || []).map((c) => [c.courseId, c]));

        const cards = courses.map((c) => {
          const p = prog.get(c.id) || { completedLessons: 0, percent: 0 };
          const status = p.completedLessons === 0 ? 'Not started' : `${p.completedLessons} of ${c.totalLessons} lessons · ${p.percent}%`;
          return `<a class="card card-link" href="${courseHref(c.id)}">
            <div class="row-between"><span class="badge badge-accent">${esc(c.level || 'Course')}</span>${p.percent === 100 && c.totalLessons > 0 ? '<span class="badge badge-ok">Completed</span>' : ''}</div>
            <h2 class="mt">${esc(c.title)}</h2>
            <p class="muted">${esc(c.description || '')}</p>
            <p class="small muted">${plural(c.totalModules, 'module')} · ${plural(c.totalLessons, 'lesson')}</p>
            ${bar(p.percent)}
            <p class="small muted mb0" style="margin-top:8px">${esc(status)}</p>
          </a>`;
        }).join('');

        setView(`<div class="page-head"><div><h1>Courses</h1><p class="muted">Pick a course and learn at your own pace. Your progress is saved automatically.</p></div></div>
          ${courses.length ? `<div class="grid grid-auto">${cards}</div>` : emptyHtml('No courses yet', 'Courses will appear here once an administrator publishes them.')}`);
      };

      /* ======================= course outline ======================= */
      CN.routes.course = async ([courseId], id) => {
        if (!courseId) { CN.go('/courses'); return; }
        let course, prog, quizzes;
        try {
          [course, prog, quizzes] = await Promise.all([
            api(`/api/courses/${enc(courseId)}`),
            api(`/api/courses/${enc(courseId)}/progress`),
            api(`/api/quizzes?courseId=${enc(courseId)}`).catch(() => [])
          ]);
        } catch (err) {
          if (stale(id)) return;
          if (err.status === 404) { setView(emptyHtml('Course not found', 'This course does not exist or is not published.', '<a class="btn btn-primary" href="#/courses">Back to courses</a>')); return; }
          throw err;
        }
        if (stale(id)) return;
        setTitle(course.title);

        const flat = course.modules.flatMap((m) => m.lessons.map((l) => Object.assign({}, l, { moduleId: m.id })));
        const byId = new Map(flat.map((l) => [l.id, l]));
        const started = prog.completedLessons > 0 || !!prog.lastLessonId;

        let target = prog.lastLessonId ? byId.get(prog.lastLessonId) : null;
        if (prog.completed) target = flat[0];
        else {
          if (!target) target = flat.find((l) => !l.completed) || flat[0];
          if (target && target.completed) {
            const i = flat.indexOf(target);
            target = flat.slice(i + 1).find((l) => !l.completed) || flat.find((l) => !l.completed) || target;
          }
        }
        const startLabel = prog.completed ? 'Review course' : started ? 'Continue learning' : 'Start course';

        const modules = course.modules.map((m, i) => {
          const done = m.lessons.filter((l) => l.completed).length;
          const open = target ? m.id === target.moduleId : i === 0;
          const rows = m.lessons.map((l) => `
            <a class="lesson-row ${l.completed ? 'done' : ''}" href="${lessonHref(l.id)}">
              <span class="tick">${icon('check', 14)}</span>
              <span>${esc(l.title)}${l.completed ? '<span class="sr-only"> (completed)</span>' : ''}</span>
              <span class="spacer"></span>
              ${l.hasVideo ? '<span class="badge">Video</span>' : ''}
              <span class="small muted">${l.estimatedMinutes} min</span>
            </a>`).join('');
          return `<details class="module" ${open ? 'open' : ''}>
            <summary><span>${esc(m.title)}</span><span class="small muted">${done}/${m.lessons.length} done</span></summary>
            ${m.description ? `<p class="muted small" style="padding:12px 18px 0;margin:0">${esc(m.description)}</p>` : ''}
            ${rows || '<p class="muted small" style="padding:12px 18px">No lessons in this module yet.</p>'}
          </details>`;
        }).join('');

        const quizCards = (quizzes || []).length
          ? `<h2 class="mt-lg">Quizzes</h2><div class="grid grid-auto">${quizzes.map((q) => `
              <a class="card card-link" href="#/quiz/${enc(q.id)}"><h3>${esc(q.title)}</h3><p class="muted small">${esc(q.description || '')}</p>
              <p class="small muted mb0">${plural(q.questionCount, 'question')} · pass at ${q.passingPercent}%</p></a>`).join('')}</div>` : '';

        setView(`
          <p class="crumbs"><a href="#/courses">Courses</a> / ${esc(course.title)}</p>
          <section class="card hero">
            <div class="stack" style="gap:8px;max-width:640px">
              <span class="badge badge-accent">${esc(course.level || 'Course')}</span>
              <h1>${esc(course.title)}</h1>
              <p class="muted mb0">${esc(course.description || '')}</p>
              ${target ? `<div class="mt"><a class="btn btn-primary" href="${lessonHref(target.id)}">${startLabel} ${icon('arrowRight')}</a></div>` : ''}
            </div>
            <div class="row" style="gap:18px">${ring(prog.percent)}<div><b style="font-size:1.1rem">${prog.completedLessons} of ${prog.totalLessons}</b><div class="muted small">lessons completed</div></div></div>
          </section>
          <h2 class="mt-lg">Lessons</h2>
          ${course.modules.length ? modules : emptyHtml('No lessons yet', 'This course does not have any lessons yet.')}
          ${quizCards}
          <p class="mt-lg"><a class="btn btn-ghost" href="#/practice?courseId=${enc(course.id)}">Practice questions for this course</a></p>`);
      };
    })();
</script>

<!-- ======== PART 7c GOES HERE (lesson viewer, quizzes, practice, bookmarks, progress, profile) ======== -->
<!-- ================================================================================
     SCRIPT 3 OF 5: LEARNING SCREENS (lesson, quizzes, practice, bookmarks, progress, profile)
     ================================================================================ -->
<script>
    (() => {
      'use strict';
      const CN = window.CN;
      const { state, esc, enc, $, $$, uuid, icon, toast, setBusy, setView, setTitle, api, stale, onLeave, onHide,
              fmtDate, fmtDateTime, relTime, ring, bar, emptyHtml, errMsg, paragraphs, codeBlock, outputBlock,
              confirmDialog, saveProgress, completeLesson, setBookmark, queueOp } = CN;

      const lessonHref = (id) => '#/lesson/' + enc(id);
      const courseHref = (id) => '#/course/' + enc(id);
      const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
      const r1 = (n) => Math.round(n * 10) / 10;
      const r3 = (n) => Math.round(n * 1000) / 1000;
      const mmss = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
      const VIDEO_ID = /^[A-Za-z0-9_-]{11}$/;

      /* ============================================================================
         LESSON VIEWER
         ============================================================================ */
      let cur = null;            // the lesson that is open right now
      let ytPromise = null;

      function loadYouTube() {
        if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
        if (ytPromise) return ytPromise;
        ytPromise = new Promise((resolve, reject) => {
          const timer = setTimeout(() => { ytPromise = null; reject(new Error('timeout')); }, 8000);
          const previous = window.onYouTubeIframeAPIReady;
          window.onYouTubeIframeAPIReady = () => {
            clearTimeout(timer);
            if (typeof previous === 'function') { try { previous(); } catch (e) { /* ignore */ } }
            resolve(window.YT);
          };
          const s = document.createElement('script');
          s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
          s.onerror = () => { clearTimeout(timer); ytPromise = null; reject(new Error('blocked')); };
          document.head.appendChild(s);
        });
        return ytPromise;
      }

      const SAVE_TEXT = { saving: ['Saving…', ''], ok: ['Progress saved', 'ok'], pending: ['Will sync when online', 'pending'], error: ['Could not save progress', 'pending'] };
      function setSave(kind) {
        const el = $('#save-status'); if (!el) return;
        const t = SAVE_TEXT[kind]; el.textContent = t[0]; el.className = 'save-status ' + t[1];
      }
      function readingFraction() {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        return max > 40 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      }
      function restoreReading(f) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        if (max > 0) window.scrollTo({ top: f * max, behavior: 'auto' });
      }
      async function pushProgress(body) {
        const c = cur; if (!c) return;
        setSave('saving');
        try { const r = await saveProgress(c.lessonId, body); if (cur === c) setSave(r.ok ? 'ok' : 'pending'); }
        catch (err) { if (cur === c) setSave('error'); }
      }

      /* ----- video ----- */
      function saveVideoPos(force) {
        if (!cur || !cur.player || !cur.playerReady) return;
        let t; try { t = cur.player.getCurrentTime(); } catch (e) { return; }
        if (!isFinite(t)) return;
        if (force || Math.abs(t - cur.sentVideo) >= 5) { cur.sentVideo = t; cur.videoPos = t; pushProgress({ videoPositionSeconds: r1(t) }); }
      }
      function stopPoll() { if (cur && cur.poll) { clearInterval(cur.poll); cur.poll = null; } }
      function onPlayerState(e) {
        if (!cur) return;
        if (e.data === 1) { stopPoll(); cur.poll = setInterval(() => saveVideoPos(false), 10000); }
        else {
          stopPoll();
          if (e.data === 2) saveVideoPos(true);
          else if (e.data === 0) { cur.videoPos = 0; cur.sentVideo = 0; pushProgress({ videoPositionSeconds: 0 }); }
        }
      }
      async function ensurePlayer() {
        if (!cur || !cur.hasVideo || cur.player || cur.playerStarting) return;
        const c = cur; c.playerStarting = true;
        const note = $('#video-note');
        const start = Math.floor(c.videoPos || 0);
        try {
          const YT = await loadYouTube();
          if (cur !== c) return;
          c.player = new YT.Player('yt-player', {
            videoId: c.videoId, host: 'https://www.youtube-nocookie.com',
            playerVars: { start, rel: 0, playsinline: 1, origin: location.origin },
            events: {
              onReady: () => { c.playerReady = true; if (note) note.textContent = start > 5 ? 'Resumed from ' + mmss(start) + '. Your playback position is saved as you watch.' : 'Your playback position is saved as you watch.'; },
              onStateChange: onPlayerState
            }
          });
        } catch (e) {
          const frame = $('#video-frame');
          if (frame && cur === c) {
            frame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${c.videoId}?start=${start}&rel=0" title="${esc(c.title)}" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
            if (note) note.textContent = 'The playback position cannot be tracked right now (the YouTube player script did not load). Your lesson progress is still saved.';
          }
        }
      }

      /* ----- completion and bookmark buttons ----- */
      function renderCompleteBtns() {
        if (!cur) return;
        $$('[data-complete-btn]').forEach((b) => {
          if (cur.completed) { b.className = 'btn btn-secondary'; b.disabled = true; b.innerHTML = icon('check') + ' Completed'; }
          else if (cur.pendingComplete) { b.className = 'btn btn-secondary'; b.disabled = true; b.innerHTML = 'Waiting to sync…'; }
          else { b.className = 'btn btn-primary'; b.disabled = false; b.innerHTML = icon('check') + ' Mark as completed'; }
        });
        const st = $('#lesson-status');
        if (st) st.innerHTML = cur.completed ? '<span class="badge badge-ok">Completed</span>' : cur.pendingComplete ? '<span class="badge badge-warn">Completion not synced yet</span>' : '';
        const next = $('#next-link'); if (next) next.className = 'btn ' + (cur.completed ? 'btn-primary' : 'btn-secondary');
      }
      function renderBookmarkBtn() {
        const b = $('#bookmark-btn'); if (!b || !cur) return;
        b.setAttribute('aria-pressed', String(cur.bookmarked));
        b.innerHTML = icon('bookmark') + (cur.bookmarked ? ' Bookmarked' : ' Bookmark');
        b.className = 'btn ' + (cur.bookmarked ? 'btn-secondary' : 'btn-ghost');
      }
      function applyCompleted(data) {
        if (!cur) return;
        cur.completed = true; cur.pendingComplete = false;
        renderCompleteBtns();
        if (data && data.newlyCompleted) toast(`Lesson completed! +${data.pointsAwarded} points`, 'success');
        else toast('This lesson was already completed.', 'info');
        if (data) {
          (data.newAchievements || []).forEach((a) => toast(`Achievement unlocked: ${a.title} (+${a.points} pts)`, 'success', 8000));
          const c = data.course, el = $('#course-progress');
          if (c && el) el.textContent = `${c.completedLessons} of ${c.totalLessons} lessons completed in this course (${c.percent}%).` + (data.streak ? ` Streak: ${data.streak.currentStreak} day${data.streak.currentStreak === 1 ? '' : 's'}.` : '');
          if (c && c.completed) toast('You completed the whole course. Congratulations!', 'success', 9000);
        }
      }

      CN.actions['complete-lesson'] = async () => {
        if (!cur || cur.completed || cur.completing || cur.pendingComplete) return;
        const c = cur; c.completing = true;
        const btns = $$('[data-complete-btn]');
        btns.forEach((b) => setBusy(b, true, 'Saving…'));
        try {
          const r = await completeLesson(c.lessonId);
          if (cur !== c) return;
          if (r.ok) applyCompleted(r.data);
          else { c.pendingComplete = true; toast('The server cannot be reached. Your completion is kept on this device and will be saved automatically when the connection returns.', 'warn', 9000); }
        } catch (err) { toast(errMsg(err), 'error'); }
        finally { c.completing = false; btns.forEach((b) => setBusy(b, false)); renderCompleteBtns(); }
      };

      CN.actions['toggle-bookmark'] = async () => {
        if (!cur || cur.bmBusy) return;
        const c = cur; c.bmBusy = true;
        const want = !c.bookmarked;
        try {
          const r = await setBookmark(c.lessonId, want);
          c.bookmarked = want; renderBookmarkBtn();
          if (r.ok) toast(want ? 'Lesson bookmarked' : 'Bookmark removed', 'success', 2200);
          else toast('Offline: this bookmark change will be saved when the connection returns.', 'warn', 6000);
        } catch (err) { toast(errMsg(err), 'error'); }
        finally { c.bmBusy = false; }
      };

      CN.actions['reading-top'] = () => { window.scrollTo({ top: 0 }); const n = $('#resume-note'); if (n) n.remove(); if (cur) { cur.readPos = 0; cur.sentRead = 0; pushProgress({ readingPosition: 0 }); } };

      function setMode(mode, persist) {
        if (!cur || cur.mode === mode) return;
        if (cur.mode === 'READING') cur.readPos = readingFraction();
        if (cur.mode === 'VIDEO') { saveVideoPos(true); try { if (cur.player) cur.player.pauseVideo(); } catch (e) { /* ignore */ } }
        cur.mode = mode;
        $('#tab-reading').setAttribute('aria-selected', String(mode === 'READING'));
        $('#tab-video').setAttribute('aria-selected', String(mode === 'VIDEO'));
        $('#panel-reading').hidden = mode !== 'READING';
        $('#panel-video').hidden = mode !== 'VIDEO';
        if (mode === 'VIDEO') { window.scrollTo(0, 0); ensurePlayer(); }
        else requestAnimationFrame(() => restoreReading(cur ? cur.readPos : 0));
        if (persist && (mode === 'READING' || cur.hasVideo)) pushProgress({ mode });
      }
      CN.actions['switch-mode'] = (el) => setMode(el.dataset.mode, true);

      /* ----- the route ----- */
      CN.routes.lesson = async ([lessonId], id) => {
        if (!lessonId) { CN.go('/courses'); return; }
        let d;
        try { d = await api(`/api/lessons/${enc(lessonId)}`); }
        catch (err) {
          if (stale(id)) return;
          if (err.status === 404) { setView(emptyHtml('Lesson not found', 'This lesson does not exist or is not published.', '<a class="btn btn-primary" href="#/courses">Back to courses</a>')); return; }
          throw err;
        }
        if (stale(id)) return;
        const quizzes = await api(`/api/quizzes?moduleId=${enc(d.moduleId)}`).catch(() => []);
        if (stale(id)) return;
        setTitle(d.title);

        const hasVideo = !!d.youtubeVideoId && VIDEO_ID.test(d.youtubeVideoId);
        const startMode = hasVideo && d.lastMode === 'VIDEO' ? 'VIDEO' : 'READING';
        cur = { lessonId: d.id, title: d.title, hasVideo, videoId: d.youtubeVideoId, mode: startMode,
                completed: !!d.completed, bookmarked: !!d.bookmarked, pendingComplete: false,
                readPos: d.readingPosition || 0, sentRead: d.readingPosition || 0, videoPos: d.videoPositionSeconds || 0, sentVideo: d.videoPositionSeconds || 0 };

        const list = (title, items, cls) => (items && items.length)
          ? `<div class="callout ${cls || ''}"><h3>${title}</h3><ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>` : '';
        const examples = (d.examples || []).map((e) => codeBlock(e.code, e.title) + (e.expectedOutput ? outputBlock(e.expectedOutput) : '')).join('');
        const objectives = (d.objectives || []).length ? `<ul class="objectives">${d.objectives.map((o) => `<li>${esc(o)}</li>`).join('')}</ul>` : '';
        const related = (d.relatedTopics || []).length ? `<h3>Related topics</h3><p>${d.relatedTopics.map((t) => `<span class="tag">${esc(t)}</span>`).join(' ')}</p>` : '';
        const quizLinks = (quizzes || []).length ? `<div class="card mt-lg"><h3>Test yourself</h3><div class="stack">${quizzes.map((q) => `<a class="btn btn-ghost" href="#/quiz/${enc(q.id)}">${esc(q.title)} · ${plural(q.questionCount, 'question')}</a>`).join('')}</div></div>` : '';

        const videoPanel = hasVideo
          ? `<h2>${esc(d.videoTitle || d.title)}</h2>
             <div class="video-frame" id="video-frame"><div id="yt-player"></div></div>
             <p class="small muted" id="video-note" aria-live="polite"></p>
             <div class="card mt"><h3>What you will learn</h3>${objectives || '<p class="muted">See the reading material for the details.</p>'}
               <button type="button" class="btn btn-ghost" data-action="switch-mode" data-mode="READING">Read the full lesson</button></div>`
          : emptyHtml('No video for this lesson yet', 'An administrator can add a YouTube link from the admin dashboard. The reading material has everything you need.',
              '<button type="button" class="btn btn-primary" data-action="switch-mode" data-mode="READING">Read the lesson</button>');

        setView(`
          <p class="crumbs"><a href="#/courses">Courses</a> / <a href="${courseHref(d.courseId)}">${esc(d.courseTitle)}</a> / ${esc(d.moduleTitle)}</p>
          <div class="lesson-head row-between">
            <div><h1>${esc(d.title)}</h1><p class="muted mb0">${d.estimatedMinutes} min · <span id="lesson-status"></span></p></div>
            <div class="row"><span id="save-status" class="save-status" aria-live="polite"></span>
              <button type="button" id="bookmark-btn" class="btn btn-ghost" data-action="toggle-bookmark" aria-pressed="false"></button>
              <button type="button" class="btn btn-primary" data-complete-btn data-action="complete-lesson"></button></div>
          </div>
          <div class="tabs" role="tablist" aria-label="Lesson mode">
            <button type="button" class="tab" role="tab" id="tab-reading" aria-selected="${startMode === 'READING'}" data-action="switch-mode" data-mode="READING">Reading</button>
            <button type="button" class="tab" role="tab" id="tab-video" aria-selected="${startMode === 'VIDEO'}" data-action="switch-mode" data-mode="VIDEO">Video${hasVideo ? '' : ' (none yet)'}</button>
          </div>
          <section id="panel-reading" role="tabpanel" aria-labelledby="tab-reading" ${startMode === 'READING' ? '' : 'hidden'}>
            <div class="prose">
              ${objectives ? `<h3>Learning objectives</h3>${objectives}` : ''}
              ${paragraphs(d.explanation)}
              ${examples ? `<h3>Examples</h3>${examples}` : ''}
              ${list('Important notes', d.importantNotes)}
              ${list('Common mistakes', d.commonMistakes, 'callout-warn')}
              ${related}
            </div>
            ${quizLinks}
          </section>
          <section id="panel-video" role="tabpanel" aria-labelledby="tab-video" ${startMode === 'VIDEO' ? '' : 'hidden'}>${videoPanel}</section>
          <p class="small muted mt" id="course-progress"></p>
          <nav class="lesson-nav" aria-label="Lesson navigation">
            ${d.previousLessonId ? `<a class="btn btn-ghost" href="${lessonHref(d.previousLessonId)}">${icon('arrowLeft')} Previous</a>` : '<span></span>'}
            <button type="button" class="btn btn-primary" data-complete-btn data-action="complete-lesson"></button>
            ${d.nextLessonId ? `<a id="next-link" class="btn btn-secondary" href="${lessonHref(d.nextLessonId)}">Next ${icon('arrowRight')}</a>` : `<a class="btn btn-ghost" href="${courseHref(d.courseId)}">Back to course</a>`}
          </nav>`);

        renderCompleteBtns(); renderBookmarkBtn();

        // remember where the student is (this is what "Continue Learning" uses)
        pushProgress(hasVideo ? { mode: startMode } : {});

        if (startMode === 'READING' && d.readingPosition > 0.03) {
          const note = document.createElement('div');
          note.id = 'resume-note'; note.className = 'flash flash-info';
          note.innerHTML = 'Resumed where you left off. <button type="button" class="btn btn-ghost btn-sm" data-action="reading-top">Start from the top</button>';
          $('#panel-reading').prepend(note);
          setTimeout(() => { if (cur && cur.lessonId === d.id) restoreReading(d.readingPosition); }, 80);
        }
        if (startMode === 'VIDEO') ensurePlayer();

        // a completion that was queued while offline can finish while this lesson is open
        CN.onQueuedComplete = (lid, data) => { if (cur && cur.lessonId === lid) applyCompleted(data); };

        const onScroll = CN.throttle(() => {
          if (!cur || cur.mode !== 'READING') return;
          const f = readingFraction(); cur.readPos = f;
          if (Math.abs(f - cur.sentRead) >= 0.04) { cur.sentRead = f; pushProgress({ readingPosition: r3(f) }); }
        }, 4000);
        window.addEventListener('scroll', onScroll, { passive: true });

        onHide(() => {
          if (!cur) return;
          const body = {};
          if (cur.mode === 'READING') body.readingPosition = r3(readingFraction());
          if (cur.player && cur.playerReady) { try { body.videoPositionSeconds = r1(cur.player.getCurrentTime()); } catch (e) { /* ignore */ } }
          queueOp({ k: 'progress', lessonId: cur.lessonId, body });   // stored on this device first, in case the page closes
          CN.flushQueue();
        });

        onLeave(() => {
          window.removeEventListener('scroll', onScroll);
          const c = cur; cur = null; CN.onQueuedComplete = null;
          if (!c) return;
          const body = {};
          if (c.mode === 'READING') body.readingPosition = r3(readingFraction());
          if (c.poll) clearInterval(c.poll);
          if (c.player && c.playerReady) {
            try { body.videoPositionSeconds = r1(c.player.getCurrentTime()); } catch (e) { /* ignore */ }
            try { c.player.destroy(); } catch (e) { /* ignore */ }
          }
          saveProgress(c.lessonId, body).catch(() => {});
        });
      };

      /* ============================================================================
         QUIZZES
         ============================================================================ */
      CN.routes.quizzes = async (args, id) => {
        setTitle('Quizzes');
        const [quizzes, attempts, courses] = await Promise.all([api('/api/quizzes'), api('/api/quiz-attempts'), api('/api/courses')]);
        if (stale(id)) return;
        const courseName = new Map(courses.map((c) => [c.id, c.title]));
        const best = new Map(), count = new Map();
        attempts.forEach((a) => { count.set(a.quizId, (count.get(a.quizId) || 0) + 1); best.set(a.quizId, Math.max(best.get(a.quizId) || 0, a.scorePercent)); });

        const cards = quizzes.map((q) => `
          <a class="card card-link" href="#/quiz/${enc(q.id)}">
            <span class="badge">${esc(courseName.get(q.courseId) || 'Quiz')}</span>
            <h2 class="mt">${esc(q.title)}</h2><p class="muted">${esc(q.description || '')}</p>
            <p class="small muted">${plural(q.questionCount, 'question')} · pass at ${q.passingPercent}%</p>
            ${count.has(q.id) ? `<span class="badge ${best.get(q.id) >= q.passingPercent ? 'badge-ok' : 'badge-warn'}">Best ${best.get(q.id)}% · ${plural(count.get(q.id), 'attempt')}</span>` : '<span class="badge badge-accent">Not attempted</span>'}
          </a>`).join('');

        const rows = attempts.slice(0, 15).map((a) => `<tr><td><a href="#/attempt/${enc(a.id)}">${esc(a.quizTitle)}</a></td><td>${a.correctAnswers}/${a.totalQuestions}</td><td><span class="badge ${a.passed ? 'badge-ok' : 'badge-warn'}">${a.scorePercent}%</span></td><td>${a.pointsAwarded}</td><td>${esc(fmtDateTime(a.attemptedAt))}</td></tr>`).join('');

        setView(`<div class="page-head"><div><h1>Quizzes</h1><p class="muted">Scores are calculated on the server. Points are awarded on your first attempt at each quiz.</p></div></div>
          ${quizzes.length ? `<div class="grid grid-auto">${cards}</div>` : emptyHtml('No quizzes yet', 'Quizzes will appear here once they are published.')}
          <h2 class="mt-lg">Your quiz history</h2>
          ${rows ? `<div class="table-wrap"><table class="table"><thead><tr><th>Quiz</th><th>Correct</th><th>Score</th><th>Points</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">You have not taken a quiz yet.</p>'}`);
      };

      let quizCtx = null;

      CN.routes.quiz = async ([quizId], id) => {
        if (!quizId) { CN.go('/quizzes'); return; }
        let quiz;
        try { quiz = await api(`/api/quizzes/${enc(quizId)}`); }
        catch (err) {
          if (stale(id)) return;
          if (err.status === 404) { setView(emptyHtml('Quiz not found', 'This quiz does not exist or is not published.', '<a class="btn btn-primary" href="#/quizzes">All quizzes</a>')); return; }
          throw err;
        }
        if (stale(id)) return;
        setTitle(quiz.title);
        quizCtx = { quizId, quiz, clientAttemptId: uuid() };       // one id per attempt: a retry can never count twice
        onLeave(() => { quizCtx = null; });

        const questions = quiz.questions.map((q, i) => `
          <fieldset class="card q-card" style="border:1px solid var(--border)">
            <legend class="small muted" style="padding:0 6px">Question ${i + 1} of ${quiz.questions.length}</legend>
            <h3>${esc(q.text)}</h3>
            ${q.options.map((o, j) => `<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}
          </fieldset>`).join('');

        setView(`<div class="narrow">
          <p class="crumbs"><a href="#/quizzes">Quizzes</a> / ${esc(quiz.title)}</p>
          <h1>${esc(quiz.title)}</h1>
          <p class="muted">${esc(quiz.description || '')} Pass mark: ${quiz.passingPercent}%.</p>
          <form data-form="quiz-submit" novalidate>
            <div class="flash flash-error hidden" data-msg role="alert"></div>
            ${questions}
            <div class="form-actions"><button type="submit" class="btn btn-primary">Submit answers</button></div>
          </form></div>`);

        const form = $('form[data-form="quiz-submit"]');
        form.addEventListener('change', (e) => {
          const input = e.target.closest('input[type=radio]'); if (!input) return;
          $$('.option', input.closest('fieldset')).forEach((o) => o.classList.toggle('selected', o.contains(input) && input.checked));
        });
      };

      CN.forms['quiz-submit'] = async (form) => {
        if (!quizCtx) return;
        const ctx = quizCtx;
        const answers = ctx.quiz.questions.map((q, i) => {
          const c = form.querySelector(`input[name="q${i}"]:checked`);
          return { questionId: q.id, selectedIndex: c ? Number(c.value) : -1 };
        });
        const blank = answers.filter((a) => a.selectedIndex < 0).length;
        if (blank && !(await confirmDialog(`You left ${plural(blank, 'question')} unanswered. Submit anyway?`, { okText: 'Submit' }))) return;

        const btn = $('button[type=submit]', form), msg = $('[data-msg]', form);
        msg.className = 'flash flash-error hidden';
        setBusy(btn, true, 'Submitting…');
        try {
          const res = await api(`/api/quizzes/${enc(ctx.quizId)}/attempts`, { method: 'POST', body: { clientAttemptId: ctx.clientAttemptId, answers } });
          if (quizCtx !== ctx) return;
          setView(resultHtml(res, ctx.quiz));
          window.scrollTo(0, 0);
          (res.newAchievements || []).forEach((a) => toast(`Achievement unlocked: ${a.title} (+${a.points} pts)`, 'success', 8000));
        } catch (err) {
          setBusy(btn, false);
          msg.className = 'flash flash-error';
          msg.textContent = (err.status === 0 ? 'Could not reach the server, so your answers were NOT submitted. They are still on this page. Please try again. ' : '') + errMsg(err);
        }
      };

      function resultHtml(res, quiz) {
        const optText = (a, idx) => {
          if (idx < 0) return 'Not answered';
          const q = quiz && quiz.questions.find((x) => x.id === a.questionId);
          return q && q.options[idx] != null ? q.options[idx] : 'Option ' + (idx + 1);
        };
        const details = (res.answers || []).map((a, i) => `
          <div class="card q-card">
            <div class="row-between"><h3>${i + 1}. ${esc(a.questionText)}</h3><span class="badge ${a.correct ? 'badge-ok' : 'badge-danger'}">${a.correct ? 'Correct' : 'Incorrect'}</span></div>
            <div class="option static ${a.correct ? 'correct' : 'wrong'}"><span><b>Your answer:</b> ${esc(optText(a, a.selectedIndex))}</span></div>
            ${a.correct ? '' : `<div class="option static correct"><span><b>Correct answer:</b> ${esc(optText(a, a.correctIndex))}</span></div>`}
            ${a.explanation ? `<div class="explain">${esc(a.explanation)}</div>` : ''}
          </div>`).join('');
        return `<div class="narrow">
          <p class="crumbs"><a href="#/quizzes">Quizzes</a> / ${esc(res.quizTitle)}</p>
          <section class="card hero"><div class="score">${ring(res.scorePercent)}
            <div><h1 class="mb0">${res.passed ? 'You passed!' : 'Not passed yet'}</h1>
              <p class="muted mb0">${res.correctAnswers} of ${res.totalQuestions} correct · ${esc(fmtDateTime(res.attemptedAt))}</p>
              <p class="mb0">${res.pointsAwarded > 0 ? `<span class="badge badge-ok">+${res.pointsAwarded} points</span>` : '<span class="small muted">Points are awarded on your first attempt at each quiz.</span>'}</p>
              ${res.duplicate ? '<p class="small muted mb0">This attempt had already been recorded; nothing was counted twice.</p>' : ''}</div></div>
            <div class="row"><a class="btn btn-primary" href="#/quiz/${enc(res.quizId)}">Try again</a><a class="btn btn-ghost" href="#/quizzes">All quizzes</a></div></section>
          <h2 class="mt-lg">Review</h2>${details}</div>`;
      }

      CN.routes.attempt = async ([attemptId], id) => {
        if (!attemptId) { CN.go('/quizzes'); return; }
        let res;
        try { res = await api(`/api/quiz-attempts/${enc(attemptId)}`); }
        catch (err) {
          if (stale(id)) return;
          if (err.status === 404) { setView(emptyHtml('Result not found', 'This quiz result does not exist.', '<a class="btn btn-primary" href="#/quizzes">All quizzes</a>')); return; }
          throw err;
        }
        const quiz = await api(`/api/quizzes/${enc(res.quizId)}`).catch(() => null);
        if (stale(id)) return;
        setTitle('Quiz result');
        setView(resultHtml(res, quiz));
      };

      /* ============================================================================
         PRACTICE
         ============================================================================ */
      CN.routes.practice = async (args, id, r) => {
        setTitle('Practice');
        const courseId = r.query.get('courseId');
        const list = await api('/api/practice' + (courseId ? '?courseId=' + enc(courseId) : ''));
        if (stale(id)) return;
        const items = list.map((p) => `
          <details class="module">
            <summary><span>${esc(p.title)}</span><span class="badge diff-${esc(p.difficulty)}">${esc(p.difficulty)}</span></summary>
            <div style="padding:16px 18px">
              <div class="prose">${paragraphs(p.description)}</div>
              ${p.starterCode ? `<h3>Starter code</h3>${codeBlock(p.starterCode, 'Starter code')}` : ''}
              <div class="row">
                ${p.hint ? `<button type="button" class="btn btn-ghost btn-sm" data-action="toggle-hint" data-id="${esc(p.id)}">Show hint</button>` : ''}
                <button type="button" class="btn btn-secondary btn-sm" data-action="show-solution" data-id="${esc(p.id)}">Show reference solution</button>
              </div>
              ${p.hint ? `<div class="callout hidden" id="hint-${esc(p.id)}"><h3>Hint</h3><p class="mb0">${esc(p.hint)}</p></div>` : ''}
              <div id="solution-${esc(p.id)}" aria-live="polite"></div>
            </div>
          </details>`).join('');
        setView(`<div class="page-head"><div><h1>Practice</h1>
          <p class="muted">Write your answer in your IDE, then compare it with the reference solution. CodeNest does <b>not</b> run your code, so there is no automatic checking.</p></div></div>
          ${courseId ? '<p><a class="btn btn-ghost btn-sm" href="#/practice">Show all practice questions</a></p>' : ''}
          ${list.length ? items : emptyHtml('No practice questions yet', 'Practice questions will appear here once they are published.')}`);
      };
      CN.actions['toggle-hint'] = (btn) => {
        const el = $('#hint-' + btn.dataset.id); if (!el) return;
        const show = el.classList.toggle('hidden') === false;
        btn.textContent = show ? 'Hide hint' : 'Show hint';
      };
      CN.actions['show-solution'] = async (btn) => {
        const slot = $('#solution-' + btn.dataset.id); if (!slot) return;
        if (slot.dataset.loaded) { slot.innerHTML = ''; delete slot.dataset.loaded; btn.textContent = 'Show reference solution'; return; }
        setBusy(btn, true, 'Loading…');
        try {
          const s = await api(`/api/practice/${enc(btn.dataset.id)}/solution`);
          slot.innerHTML = `<h3 class="mt">Reference solution</h3>${codeBlock(s.referenceSolution, 'Reference solution')}${s.expectedOutput ? outputBlock(s.expectedOutput) : ''}`;
          slot.dataset.loaded = '1';
          setBusy(btn, false); btn.textContent = 'Hide reference solution';
        } catch (err) { setBusy(btn, false); toast(errMsg(err), 'error'); }
      };

      /* ============================================================================
         BOOKMARKS
         ============================================================================ */
      CN.routes.bookmarks = async (args, id) => {
        setTitle('Bookmarks');
        const list = await api('/api/bookmarks');
        if (stale(id)) return;
        const rows = list.map((b) => `<li class="list-item" data-row="${esc(b.lessonId)}">
          <div><a href="${lessonHref(b.lessonId)}"><b>${esc(b.lessonTitle)}</b></a><div class="small muted">${esc(b.courseTitle)} · saved ${esc(relTime(b.createdAt))}</div></div>
          <button type="button" class="btn btn-ghost btn-sm" data-action="remove-bookmark" data-id="${esc(b.lessonId)}">${icon('trash', 15)} Remove</button></li>`).join('');
        setView(`<div class="page-head"><div><h1>Bookmarks</h1><p class="muted">Lessons you saved for later.</p></div></div>
          <div class="card" id="bm-card">${list.length ? `<ul class="list" id="bm-list">${rows}</ul>` : ''}</div>`);
        if (!list.length) $('#bm-card').innerHTML = emptyHtml('No bookmarks yet', 'Use the Bookmark button on any lesson to save it here.', '<a class="btn btn-primary" href="#/courses">Browse courses</a>');
      };
      CN.actions['remove-bookmark'] = async (btn) => {
        setBusy(btn, true, 'Removing…');
        try {
          const r = await setBookmark(btn.dataset.id, false);
          const row = btn.closest('[data-row]'); if (row) row.remove();
          const rest = $('#bm-list');
          if (rest && !rest.children.length) $('#bm-card').innerHTML = emptyHtml('No bookmarks yet', 'Use the Bookmark button on any lesson to save it here.', '<a class="btn btn-primary" href="#/courses">Browse courses</a>');
          if (!r.ok) toast('Offline: the removal will be saved when the connection returns.', 'warn', 6000);
        } catch (err) { setBusy(btn, false); toast(errMsg(err), 'error'); }
      };

      /* ============================================================================
         PROGRESS
         ============================================================================ */
      const ACT_ICON = { LESSON_COMPLETED: 'check', QUIZ_COMPLETED: 'book', ACHIEVEMENT_EARNED: 'trophy' };

      CN.routes.progress = async (args, id) => {
        setTitle('Progress');
        const [o, s, ach, act, attempts] = await Promise.all([api('/api/progress'), api('/api/progress/streak'), api('/api/progress/achievements'), api('/api/progress/activity'), api('/api/quiz-attempts')]);
        if (stale(id)) return;
        const courses = (o.courses || []).map((c) => `<li class="list-item" style="display:block">
          <div class="row-between"><a href="${courseHref(c.courseId)}"><b>${esc(c.courseTitle)}</b></a><span class="small muted">${c.completedLessons} of ${c.totalLessons} lessons · ${c.percent}%</span></div>
          <div style="margin-top:8px">${bar(c.percent)}</div>
          ${c.lastActivityAt ? `<div class="small muted" style="margin-top:6px">Last active ${esc(relTime(c.lastActivityAt))}</div>` : ''}</li>`).join('');
        const achv = ach.map((a) => `<div class="achv ${a.earned ? '' : 'locked'}"><span class="medal">${icon('trophy', 20)}</span><div><b>${esc(a.title)}</b><small>${a.earned ? 'Earned ' + esc(fmtDate(a.awardedAt)) + ' · +' + a.points + ' pts' : esc(a.description)}</small></div></div>`).join('');
        const activity = act.map((a) => `<li class="list-item"><span class="row" style="flex-wrap:nowrap">${icon(ACT_ICON[a.type] || 'check')}<span>${esc(a.title)}</span></span><span class="small muted">${a.points > 0 ? '+' + a.points + ' pts · ' : ''}${esc(relTime(a.occurredAt))}</span></li>`).join('');
        const rows = attempts.map((a) => `<tr><td><a href="#/attempt/${enc(a.id)}">${esc(a.quizTitle)}</a></td><td>${a.correctAnswers}/${a.totalQuestions}</td><td><span class="badge ${a.passed ? 'badge-ok' : 'badge-warn'}">${a.scorePercent}%</span></td><td>${esc(fmtDateTime(a.attemptedAt))}</td></tr>`).join('');

        setView(`<div class="page-head"><div><h1>Your progress</h1><p class="muted">Everything here is loaded from your account, so it is the same on every device.</p></div></div>
          <section class="card hero"><div class="row" style="gap:20px">${ring(o.percent)}<div><h2 class="mb0">${o.completedLessons} of ${o.totalLessons} lessons</h2><p class="muted mb0">across all courses</p></div></div>
            <div class="grid grid-3" style="min-width:min(100%,420px)"><div class="stat"><b>${o.totalPoints}</b><span>Points</span></div>
              <div class="stat"><b>${icon('flame', 22)} ${s.currentStreak}</b><span>Current streak</span></div><div class="stat"><b>${s.longestStreak}</b><span>Longest streak</span></div></div></section>
          <p class="small muted" style="margin:8px 4px 0">${s.totalLearningDays} learning day${s.totalLearningDays === 1 ? '' : 's'} so far. A day counts only when you complete a lesson or a quiz.</p>
          <section class="grid grid-2 mt-lg">
            <div class="card"><h2>Courses</h2>${courses ? `<ul class="list">${courses}</ul>` : '<p class="muted">No courses yet.</p>'}</div>
            <div class="card"><h2>Achievements</h2><div class="stack" style="gap:10px">${achv}</div></div></section>
          <section class="grid grid-2 mt">
            <div class="card"><h2>Recent activity</h2>${activity ? `<ul class="list">${activity}</ul>` : '<p class="muted">Nothing yet.</p>'}</div>
            <div class="card"><h2>Quiz history</h2>${rows ? `<div class="table-wrap"><table class="table"><thead><tr><th>Quiz</th><th>Correct</th><th>Score</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">You have not taken a quiz yet.</p>'}</div></section>`);
      };

      /* ============================================================================
         PROFILE
         ============================================================================ */
      function formMsg(form, text, type = 'error') {
        const el = $('[data-msg]', form); if (!el) return;
        el.className = 'flash flash-' + type + (text ? '' : ' hidden');
        el.textContent = text || '';
        if (text) el.setAttribute('role', type === 'error' ? 'alert' : 'status');
      }

      CN.routes.profile = async (args, id) => {
        setTitle('Profile');
        const [p, o, s, ach, attempts] = await Promise.all([api('/api/profile'), api('/api/progress'), api('/api/progress/streak'), api('/api/progress/achievements'), api('/api/quiz-attempts')]);
        if (stale(id)) return;
        const inProgress = (o.courses || []).filter((c) => c.percent > 0 && c.percent < 100);
        const done = (o.courses || []).filter((c) => c.completed);
        const earned = ach.filter((a) => a.earned);
        const chips = (list) => list.length ? list.map((c) => `<a class="tag" href="${courseHref(c.courseId)}">${esc(c.courseTitle)} · ${c.percent}%</a>`).join(' ') : '<span class="muted">None yet</span>';

        setView(`<div class="page-head"><div><h1>Your profile</h1><p class="muted">Updating your profile never affects your learning progress.</p></div></div>
          <section class="grid grid-2">
            <div class="card"><h2>Account</h2>
              <p class="mb0"><b>${esc(p.name)}</b></p><p class="muted">${esc(p.email)}</p>
              <p class="small muted">Member since ${esc(fmtDate(p.createdAt))} · ${esc(p.role === 'ADMIN' ? 'Administrator' : 'Student')}</p>
              <form data-form="profile-save" novalidate class="mt">
                <div class="flash hidden" data-msg></div>
                <div class="field"><label for="p-name">Display name</label><input id="p-name" name="name" type="text" maxlength="60" value="${esc(p.name)}" autocomplete="name"></div>
                <button type="submit" class="btn btn-primary">Save name</button></form></div>
            <div class="card"><h2>Change password</h2>
              <form data-form="password-change" novalidate>
                <div class="flash hidden" data-msg></div>
                <div class="field"><label for="pw-current">Current password</label><input id="pw-current" name="currentPassword" type="password" autocomplete="current-password" maxlength="72"></div>
                <div class="field"><label for="pw-new">New password</label><input id="pw-new" name="newPassword" type="password" autocomplete="new-password" maxlength="72"><div class="hint">At least 8 characters. Other devices will be signed out.</div></div>
                <div class="field"><label for="pw-confirm">Confirm new password</label><input id="pw-confirm" name="confirm" type="password" autocomplete="new-password" maxlength="72"></div>
                <button type="submit" class="btn btn-primary">Change password</button></form></div></section>
          <section class="grid grid-4 mt">
            <div class="stat"><b>${o.completedLessons}</b><span>Lessons completed</span></div>
            <div class="stat"><b>${attempts.length}</b><span>Quiz attempts</span></div>
            <div class="stat"><b>${icon('flame', 22)} ${s.currentStreak}</b><span>Day streak (best ${s.longestStreak})</span></div>
            <div class="stat"><b>${o.totalPoints}</b><span>Points</span></div></section>
          <section class="grid grid-2 mt">
            <div class="card"><h2>Courses in progress</h2><p>${chips(inProgress)}</p><h2 class="mt">Completed courses</h2><p class="mb0">${chips(done)}</p></div>
            <div class="card"><h2>Achievements</h2>${earned.length ? `<div class="stack" style="gap:10px">${earned.map((a) => `<div class="achv"><span class="medal">${icon('trophy', 20)}</span><div><b>${esc(a.title)}</b><small>Earned ${esc(fmtDate(a.awardedAt))} · +${a.points} pts</small></div></div>`).join('')}</div>` : '<p class="muted mb0">No achievements yet. Complete a lesson to earn your first one.</p>'}
              <p class="mt mb0"><a href="#/progress">See all progress and quiz history</a></p></div></section>`);
      };

      CN.forms['profile-save'] = async (form) => {
        formMsg(form, '');
        const name = form.elements.name.value.trim();
        if (name.length < 2 || name.length > 60) { formMsg(form, 'Enter your name (2 to 60 characters).'); return; }
        const btn = $('button[type=submit]', form); setBusy(btn, true, 'Saving…');
        try {
          const u = await api('/api/profile', { method: 'PUT', body: { name } });
          state.user = Object.assign({}, state.user, { name: u.name });
          const av = $('#avatar'); if (av) av.textContent = u.name.trim().charAt(0).toUpperCase();
          formMsg(form, 'Name updated.', 'ok'); toast('Profile updated', 'success');
        } catch (err) { formMsg(form, errMsg(err)); }
        finally { setBusy(btn, false); }
      };

      CN.forms['password-change'] = async (form) => {
        formMsg(form, '');
        const currentPassword = form.elements.currentPassword.value, newPassword = form.elements.newPassword.value, confirm = form.elements.confirm.value;
        if (!currentPassword) { formMsg(form, 'Enter your current password.'); return; }
        if (newPassword.length < 8) { formMsg(form, 'The new password must have at least 8 characters.'); return; }
        if (new TextEncoder().encode(newPassword).length > 72) { formMsg(form, 'The new password is too long (72 bytes maximum).'); return; }
        if (newPassword !== confirm) { formMsg(form, 'The new passwords do not match.'); return; }
        const btn = $('button[type=submit]', form); setBusy(btn, true, 'Changing…');
        try {
          const data = await api('/api/profile/password', { method: 'PUT', body: { currentPassword, newPassword } });
          CN.applySession(data);                                    // this browser gets a fresh session; other devices are signed out
          form.reset(); formMsg(form, 'Password changed. Other devices were signed out.', 'ok'); toast('Password changed', 'success');
        } catch (err) { formMsg(form, errMsg(err)); }
        finally { setBusy(btn, false); }
      };
    })();
</script>

<!-- ================================================================================
