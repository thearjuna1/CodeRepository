<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <meta name="description" content="CodeNest: learn Java with structured lessons, videos, quizzes and practice.">
    <title>CodeNest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233dd6c6'/%3E%3Cpath d='M13 11l-5 5 5 5M19 11l5 5-5 5' stroke='%230b1020' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <style>
        /* ===================== design tokens ===================== */
        :root{
          --bg:#0b1020; --bg-soft:#0f1730; --card:#141c34; --card-2:#1a2442; --border:#27325a;
          --text:#e8edfa; --muted:#9aa7c7; --accent:#3dd6c6; --accent-ink:#04211f; --accent-2:#8b7bff;
          --ok:#3ddc97; --warn:#f5b84b; --danger:#ff6b81; --info:#6cb4ff;
          --radius:14px; --radius-sm:10px; --shadow:0 8px 28px rgba(0,0,0,.30);
          --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
          --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
        }
        *,*::before,*::after{box-sizing:border-box}
        html{color-scheme:dark;-webkit-text-size-adjust:100%}
        body{margin:0;min-height:100vh;font-family:var(--font);font-size:16px;line-height:1.6;color:var(--text);
          background:radial-gradient(1100px 560px at 85% -12%,rgba(139,123,255,.16),transparent 60%),
                     radial-gradient(900px 480px at -8% 2%,rgba(61,214,198,.11),transparent 55%),var(--bg)}
        body.modal-open{overflow:hidden}
        h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
        h1{font-size:clamp(1.6rem,3.2vw,2.1rem)} h2{font-size:1.35rem} h3{font-size:1.1rem}
        p{margin:0 0 1em}
        a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
        :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
        button{font:inherit}
        img,svg{max-width:100%}
        .icon{vertical-align:-3px;flex:none}
        .muted{color:var(--muted)} .small{font-size:.875rem} .center{text-align:center} .right{text-align:right}
        .hidden{display:none!important}
        .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
        .mt{margin-top:16px} .mt-lg{margin-top:28px} .mb0{margin-bottom:0}

        /* ===================== layout ===================== */
        .container{width:100%;max-width:1120px;margin:0 auto;padding:26px 20px 80px;outline:none}
        .narrow{max-width:780px;margin:0 auto}
        .page-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
        .page-head p{margin:0}
        .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
        .row-between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
        .stack{display:flex;flex-direction:column;gap:14px}
        .spacer{flex:1}
        .grid{display:grid;gap:16px}
        .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
        .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
        .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
        .grid-auto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

        /* ===================== top bar ===================== */
        .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:10px 20px;
          background:rgba(11,16,32,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
        .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--text);letter-spacing:-.02em}
        .brand:hover{text-decoration:none}
        .logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none}
        .nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
        .nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.95rem}
        .nav a:hover{color:var(--text);background:rgba(255,255,255,.05);text-decoration:none}
        .nav a.active{color:var(--text);background:rgba(61,214,198,.13);box-shadow:inset 0 -2px 0 var(--accent)}
        .topbar-right{display:flex;align-items:center;gap:10px}
        .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--accent-ink);
          background:linear-gradient(135deg,var(--accent),var(--accent-2))}
        .avatar:hover{text-decoration:none;filter:brightness(1.1)}
        .nav-toggle{display:none}
        .skip-link{position:absolute;left:-9999px;top:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:700}
        .skip-link:focus{left:12px;z-index:60}
        .pill{border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:999px;cursor:default;white-space:nowrap}
        .pill-ok{color:var(--ok);border-color:rgba(61,220,151,.35)}
        .pill-busy{color:var(--info);border-color:rgba(108,180,255,.4)}
        .pill-warn{color:var(--warn);border-color:rgba(245,184,75,.5);cursor:pointer}

        /* ===================== buttons ===================== */
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid transparent;
          font-weight:700;font-size:.95rem;cursor:pointer;line-height:1.2;white-space:nowrap;transition:transform .12s,filter .15s,background .15s,border-color .15s}
        .btn:hover{text-decoration:none}
        .btn:active{transform:translateY(1px)}
        .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#2cb6d6);color:var(--accent-ink)}
        .btn-primary:hover:not([disabled]){filter:brightness(1.08)}
        .btn-secondary{background:var(--card-2);color:var(--text);border-color:var(--border)}
        .btn-secondary:hover:not([disabled]){border-color:#3b4b86}
        .btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
        .btn-ghost:hover:not([disabled]){background:rgba(255,255,255,.05)}
        .btn-danger{background:rgba(255,107,129,.13);color:#ffb3be;border-color:rgba(255,107,129,.45)}
        .btn-danger:hover:not([disabled]){background:rgba(255,107,129,.24)}
        .btn-sm{padding:6px 12px;font-size:.84rem;border-radius:8px}
        .btn-block{width:100%}
        .icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer}
        .icon-btn:hover{background:rgba(255,255,255,.06)}
        .spinner{width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
        .spinner.big{width:34px;height:34px;border-width:3px;color:var(--accent)}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* ===================== cards, badges ===================== */
        .card{background:linear-gradient(180deg,var(--card),#121a30);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
        .card h2,.card h3{margin-bottom:.4em}
        .card-link{display:block;color:inherit;transition:transform .15s,border-color .15s}
        .card-link:hover{text-decoration:none;transform:translateY(-2px);border-color:#3b4b86}
        .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:700;border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,.03)}
        .badge-ok{color:var(--ok);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
        .badge-accent{color:var(--accent);border-color:rgba(61,214,198,.4);background:rgba(61,214,198,.08)}
        .badge-warn{color:var(--warn);border-color:rgba(245,184,75,.45);background:rgba(245,184,75,.08)}
        .badge-danger{color:var(--danger);border-color:rgba(255,107,129,.45);background:rgba(255,107,129,.08)}
        .tag{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);font-size:.85rem;color:var(--muted)}

        /* ===================== forms ===================== */
        .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
        .field>label,.label{font-weight:600;font-size:.9rem}
        .field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],
        .field select,.field textarea,.input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#0e152b;color:var(--text);font:inherit}
        .field textarea{min-height:90px;resize:vertical}
        .field textarea.mono,textarea.mono{font-family:var(--mono);font-size:.88rem;line-height:1.5}
        .field input:focus,.field select:focus,.field textarea:focus,.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
        .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
        .field-error{color:#ff9aa9;font-size:.84rem;min-height:1em}
        .hint{color:var(--muted);font-size:.84rem}
        .check{display:flex;gap:10px;align-items:center;cursor:pointer}
        .check input{width:18px;height:18px;accent-color:var(--accent)}
        .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
        .form-grid .full{grid-column:1/-1}
        .form-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}

        /* ===================== auth ===================== */
        .boot{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:14px;color:var(--muted)}
        .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px}
        .auth-card{width:100%;max-width:440px;background:linear-gradient(180deg,var(--card),#111830);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
        .auth-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.4rem;color:var(--text);margin-bottom:18px}
        .auth-brand:hover{text-decoration:none}
        .auth-foot{margin-top:16px}
        .flash{padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:16px;border:1px solid var(--border);font-size:.93rem}
        .flash-info{background:rgba(108,180,255,.09);border-color:rgba(108,180,255,.4)}
        .flash-warn{background:rgba(245,184,75,.09);border-color:rgba(245,184,75,.45)}
        .flash-error{background:rgba(255,107,129,.09);border-color:rgba(255,107,129,.45)}
        .flash-ok{background:rgba(61,220,151,.09);border-color:rgba(61,220,151,.4)}

        /* ===================== progress visuals ===================== */
        .bar{height:9px;border-radius:999px;background:var(--card-2);overflow:hidden}
        .bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
        .ring{--p:0;width:108px;height:108px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;
          background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--card-2) 0)}
        .ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
        .ring span{position:relative;font-weight:800;font-size:1.3rem}
        .stat{background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
        .stat b{display:block;font-size:1.6rem;line-height:1.2}
        .stat span{color:var(--muted);font-size:.85rem}
        .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
        .week .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
        .week .barv{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));min-height:4px}
        .week .barv.zero{background:var(--card-2)}
        .week small{color:var(--muted);font-size:.74rem}

        /* ===================== lists ===================== */
        .list{list-style:none;margin:0;padding:0}
        .list-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}
        .list-item:last-child{border-bottom:0}
        .hero{display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,rgba(61,214,198,.13),rgba(139,123,255,.15));border-color:#35457a}
        .achv{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2)}
        .achv .medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--warn),#ff9d4d);color:#2b1a00}
        .achv.locked{opacity:.55}
        .achv.locked .medal{background:var(--card);color:var(--muted);border:1px dashed var(--border)}
        .achv b{display:block;font-size:.93rem}
        .achv small{color:var(--muted)}

        /* ===================== courses ===================== */
        .module{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);margin-bottom:12px;overflow:hidden}
        .module>summary{cursor:pointer;list-style:none;padding:16px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700}
        .module>summary::-webkit-details-marker{display:none}
        .module[open]>summary{border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
        .lesson-row{display:flex;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--text)}
        .lesson-row:last-child{border-bottom:0}
        .lesson-row:hover{background:rgba(255,255,255,.04);text-decoration:none}
        .lesson-row .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex:none;color:transparent}
        .lesson-row.done .tick{background:var(--ok);border-color:var(--ok);color:#052e1a}

        /* ===================== lesson viewer ===================== */
        .lesson-head{margin-bottom:18px}
        .crumbs{color:var(--muted);font-size:.88rem;margin-bottom:6px}
        .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:20px}
        .tab{background:none;border:0;color:var(--muted);padding:10px 16px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
        .tab:hover{color:var(--text)}
        .tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
        .prose{max-width:72ch;font-size:1.04rem;line-height:1.75}
        .prose p{margin-bottom:1.1em}
        .prose h3{margin-top:1.6em}
        .objectives{margin:0 0 1.2em;padding-left:1.2em}
        .objectives li{margin-bottom:.35em}
        .code{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:#0a0f1f;margin:14px 0}
        .code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:#111a33;border-bottom:1px solid var(--border);font-size:.82rem;color:var(--muted)}
        .code pre,.output pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.88rem;line-height:1.6;color:#d9e2ff;tab-size:4}
        .output{border:1px solid rgba(61,220,151,.35);border-radius:var(--radius-sm);background:rgba(61,220,151,.05);margin:-6px 0 18px;overflow:hidden}
        .output-head{padding:5px 14px;font-size:.78rem;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid rgba(61,220,151,.25)}
        .tok-c{color:#6f7da6;font-style:italic}.tok-s{color:#9be28f}.tok-k{color:#c3a4ff}.tok-a{color:#ffcf7a}.tok-n{color:#ffb38a}.tok-t{color:#6fd3ff}
        .callout{border-left:4px solid var(--info);background:rgba(108,180,255,.07);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:12px 0}
        .callout ul{margin:0;padding-left:1.1em}
        .callout h3{font-size:1rem;margin-bottom:.4em}
        .callout-warn{border-left-color:var(--warn);background:rgba(245,184,75,.07)}
        .lesson-nav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:28px}
        .save-status{font-size:.84rem;color:var(--muted)}
        .save-status.ok{color:var(--ok)} .save-status.pending{color:var(--warn)}
        .video-frame{position:relative;aspect-ratio:16/9;width:100%;max-width:880px;background:#000;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}
        .video-frame iframe,.video-frame>div{position:absolute;inset:0;width:100%;height:100%}

        /* ===================== quizzes / practice ===================== */
        .q-card{margin-bottom:16px}
        .q-card h3{font-size:1.05rem}
        .option{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-soft);cursor:pointer;margin-top:8px}
        .option:hover{border-color:#3b4b86}
        .option input{margin-top:5px;accent-color:var(--accent)}
        .option.selected{border-color:var(--accent);background:rgba(61,214,198,.09)}
        .option.correct{border-color:var(--ok);background:rgba(61,220,151,.1)}
        .option.wrong{border-color:var(--danger);background:rgba(255,107,129,.1)}
        .option.static{cursor:default}
        .explain{margin-top:10px;padding:10px 14px;border-radius:var(--radius-sm);background:rgba(255,255,255,.04);font-size:.94rem}
        .score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
        .diff-EASY{color:var(--ok)} .diff-MEDIUM{color:var(--warn)} .diff-HARD{color:var(--danger)}

        /* ===================== tables ===================== */
        .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
        .table{width:100%;border-collapse:collapse;font-size:.92rem}
        .table th,.table td{padding:10px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
        .table th{background:#111a33;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
        .table tr:last-child td{border-bottom:0}
        .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
        .repeater-item{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:rgba(255,255,255,.02)}

        /* ===================== modal, toast, states ===================== */
        .modal-backdrop{position:fixed;inset:0;z-index:90;background:rgba(4,7,16,.72);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow-y:auto}
        .modal{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);animation:rise .2s ease}
        .modal-wide{max-width:860px}
        .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
        .modal-head h2{margin:0;font-size:1.15rem}
        .modal-body{padding:20px}
        .modal-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
        #toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:10px;max-width:min(390px,calc(100vw - 32px))}
        .toast{padding:12px 16px;border-radius:10px;background:var(--card-2);border:1px solid var(--border);box-shadow:var(--shadow);animation:rise .22s ease;transition:opacity .3s,transform .3s}
        .toast-success{border-color:rgba(61,220,151,.6)} .toast-error{border-color:rgba(255,107,129,.65)}
        .toast-warn{border-color:rgba(245,184,75,.65)} .toast-info{border-color:rgba(108,180,255,.55)}
        .toast.out{opacity:0;transform:translateY(6px)}
        @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
        .empty{text-align:center;padding:48px 20px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted)}
        .empty h2{color:var(--text)}
        .skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 37%,var(--card) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:10px}
        .sk-title{height:34px;width:40%;margin-bottom:18px}.sk-line{height:16px;width:70%;margin-bottom:12px}.sk-card{height:180px;margin-top:20px}
        @keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

        /* ===================== responsive ===================== */
        @media (max-width:960px){
          .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
          .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
          .nav-toggle{display:inline-grid}
          .topbar{flex-wrap:wrap}
          .topbar-right{margin-left:auto}
          .nav{display:none;order:5;flex:1 1 100%;flex-direction:column;padding-top:6px}
          .topbar.nav-open .nav{display:flex}
          .nav a{padding:10px 12px}
        }
        @media (max-width:640px){
          .grid-2,.grid-3,.grid-4,.form-grid{grid-template-columns:1fr}
          .container{padding:18px 14px 70px}
          .auth-card{padding:22px}
          .hero{padding:18px}
          .pill{display:none}
          .pill.pill-warn,.pill.pill-busy{display:inline-block}
          .lesson-nav .btn{flex:1}
        }
        @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>

<body>
<noscript><p style="padding:24px">CodeNest needs JavaScript to run. Please enable it in your browser.</p></noscript>

<div id="app"><div class="boot"><div class="spinner big"></div><p>Loading CodeNest…</p></div></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<!-- ================================================================================
     SCRIPT 1 OF 5: CORE (state, API with token refresh, offline-safe saving, router, UI helpers)
     ================================================================================ -->
<script>
    (() => {
      'use strict';

      /* ======================= namespace shared by all script blocks ======================= */
      const CN = (window.CN = {
        routes: {},                 // route name -> async (args, renderId, route) => void
        actions: {},                // data-action name -> (element, event) => void
        forms: {},                  // data-form name -> (form, event) => void
        hooks: { hide: [] },        // functions run when the page is hidden or closed
        leave: [],                  // clean-up functions run when leaving the current route
        state: { token: null, tokenExp: 0, user: null, flash: null, returnTo: null, shellMounted: false, renderId: 0 }
      });
      const state = CN.state;

      /* ======================= small utilities ======================= */
      const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const enc = encodeURIComponent;
      const $ = (sel, root = document) => root.querySelector(sel);
      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

      function uuid() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0;
          return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
        });
      }

      const D_FMT = new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kolkata' });
      const DT_FMT = new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' });
      function fmtDate(v) { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' : D_FMT.format(d); }
      function fmtDateTime(v) { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' : DT_FMT.format(d); }
      function relTime(v) {
        if (!v) return '';
        const d = new Date(v); if (isNaN(d)) return '';
        const s = Math.round((Date.now() - d.getTime()) / 1000);
        if (s < 45) return 'just now';
        if (s < 3600) return Math.round(s / 60) + ' min ago';
        if (s < 86400) return Math.round(s / 3600) + ' h ago';
        if (s < 86400 * 7) return Math.round(s / 86400) + ' day' + (Math.round(s / 86400) === 1 ? '' : 's') + ' ago';
        return fmtDate(v);
      }

      function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
      function throttle(fn, ms) {
        let last = 0, timer = null;
        return (...a) => {
          const now = Date.now();
          if (now - last >= ms) { last = now; fn(...a); }
          else { clearTimeout(timer); timer = setTimeout(() => { last = Date.now(); fn(...a); }, ms - (now - last)); }
        };
      }

      /** Turns plain text (paragraphs separated by blank lines) into escaped <p> elements. */
      function paragraphs(text) {
        return String(text || '').split(/\n{2,}/).map((p) => p.trim()).filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join('');
      }

      /* ======================= icons ======================= */
      const ICONS = {
        check: '<polyline points="20 6 9 17 4 12"/>',
        x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
        menu: '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
        bookmark: '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
        plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
        trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
        edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
        copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
        flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.4 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
        trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
        play: '<polygon points="5 3 19 12 5 21 5 3"/>',
        book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
        user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        arrowLeft: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
        arrowRight: '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>'
      };
      function icon(name, size = 18) {
        return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[name] || ''}</svg>`;
      }
      const LOGO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06231f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>';

      /* ======================= toast, modal, confirm ======================= */
      function toast(message, type = 'info', ms = 4800) {
        const root = $('#toasts'); if (!root) return;
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.setAttribute('role', type === 'error' ? 'alert' : 'status');
        el.textContent = message;
        root.appendChild(el);
        setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, ms);
      }

      let modalCount = 0;
      function openModal({ title, html, wide = false, onMount, onClose }) {
        const root = $('#modal-root');
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `<div class="modal${wide ? ' modal-wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
          <div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-modal-close aria-label="Close">${icon('x')}</button></div>
          <div class="modal-body">${html}</div></div>`;
        const opener = document.activeElement;
        root.appendChild(backdrop);
        modalCount++; document.body.classList.add('modal-open');
        const modal = $('.modal', backdrop), body = $('.modal-body', backdrop);
        let closed = false;

        function onKey(e) {
          if (root.lastElementChild !== backdrop) return;       // only the top-most modal reacts
          if (e.key === 'Escape') { e.stopPropagation(); close(); }
          else if (e.key === 'Tab') {
            const f = $$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', modal).filter((n) => n.offsetParent !== null);
            if (!f.length) return;
            const first = f[0], last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
        }
        function close() {
          if (closed) return; closed = true;
          document.removeEventListener('keydown', onKey, true);
          backdrop.remove();
          modalCount = Math.max(0, modalCount - 1);
          if (!modalCount) document.body.classList.remove('modal-open');
          if (opener && opener.focus) opener.focus();
          if (onClose) onClose();
        }
        document.addEventListener('keydown', onKey, true);
        backdrop.addEventListener('click', (e) => { if (e.target.closest('[data-modal-close]')) close(); });
        const handle = { el: modal, body, close };
        if (onMount) onMount(handle);
        const first = $('input:not([type=hidden]),select,textarea', body) || $('[data-modal-close]', modal);
        if (first) first.focus();
        return handle;
      }

      function confirmDialog(message, { title = 'Please confirm', okText = 'Confirm', danger = false } = {}) {
        return new Promise((resolve) => {
          let answer = false;
          const m = openModal({
            title,
            html: `<p>${esc(message)}</p><div class="modal-foot"><button type="button" class="btn btn-ghost" data-cancel>Cancel</button><button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(okText)}</button></div>`,
            onClose: () => resolve(answer)
          });
          $('[data-cancel]', m.body).addEventListener('click', () => m.close());
          $('[data-ok]', m.body).addEventListener('click', () => { answer = true; m.close(); });
        });
      }

      function setBusy(btn, busy, text) {
        if (!btn) return;
        if (busy) {
          if (btn.dataset.html === undefined) btn.dataset.html = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = `<span class="spinner" aria-hidden="true"></span> ${esc(text || 'Please wait…')}`;
        } else {
          btn.disabled = false;
          if (btn.dataset.html !== undefined) { btn.innerHTML = btn.dataset.html; delete btn.dataset.html; }
        }
      }

      /* ======================= view helpers ======================= */
      const view = () => $('#view');
      function setView(html) { const v = view(); if (v) v.innerHTML = html; }
      function setTitle(t) { document.title = t ? t + ' · CodeNest' : 'CodeNest'; }
      const loadingHtml = () => '<div class="narrow"><div class="skeleton sk-title"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:55%"></div><div class="skeleton sk-card"></div></div>';

      function errMsg(err) {
        if (!err) return 'Something went wrong.';
        if (err.fieldErrors) { const f = Object.values(err.fieldErrors); if (f.length) return f.join(' '); }
        return err.message || 'Something went wrong.';
      }
      function errorHtml(err) {
        const net = err && (err.status === 0 || err.status >= 500);
        return `<div class="empty"><h2>${err && err.status === 0 ? 'You appear to be offline' : 'Something went wrong'}</h2>
          <p>${esc(errMsg(err))}</p>${net ? '<p class="small">Your saved progress is safe in your account.</p>' : ''}
          <button type="button" class="btn btn-primary" data-action="retry-route">Try again</button></div>`;
      }
      function emptyHtml(title, text, actionHtml = '') {
        return `<div class="empty"><h2>${esc(title)}</h2><p>${esc(text)}</p>${actionHtml}</div>`;
      }
      const notFoundHtml = () => emptyHtml('Page not found', 'That page does not exist.', '<a class="btn btn-primary" href="#/dashboard">Go to dashboard</a>');

      const ring = (percent) => `<div class="ring" style="--p:${Number(percent) || 0}" role="img" aria-label="${Number(percent) || 0} percent complete"><span>${Number(percent) || 0}%</span></div>`;
      const bar = (percent) => `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Number(percent) || 0}"><span style="width:${Number(percent) || 0}%"></span></div>`;

      /* ----- code blocks with a small Java highlighter ----- */
      const JAVA_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])')|(@\w+)|\b(abstract|assert|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|package|private|protected|public|record|return|short|static|super|switch|this|throw|throws|try|var|void|while|true|false|null)\b|\b(\d[\d_]*\.?\d*[LlFfDd]?)\b|\b([A-Z][A-Za-z0-9_]*)\b/g;
      function highlightJava(code) {
        let out = '', last = 0, m;
        JAVA_RE.lastIndex = 0;
        while ((m = JAVA_RE.exec(code))) {
          out += esc(code.slice(last, m.index));
          const cls = m[1] ? 'tok-c' : m[2] ? 'tok-s' : m[3] ? 'tok-a' : m[4] ? 'tok-k' : m[5] ? 'tok-n' : 'tok-t';
          out += `<span class="${cls}">${esc(m[0])}</span>`;
          last = m.index + m[0].length;
        }
        return out + esc(code.slice(last));
      }
      const looksLikeJava = (code) => /(\bclass\b|\binterface\b|\bpublic\b|\bimport\b|System\.out)/.test(code) && /[{;]/.test(code);
      function codeBlock(code, title) {
        const body = looksLikeJava(code) ? highlightJava(code) : esc(code);
        return `<div class="code"><div class="code-head"><span>${esc(title || 'Example')}</span><button type="button" class="btn btn-ghost btn-sm" data-action="copy-code">${icon('copy', 14)} Copy</button></div><pre tabindex="0"><code>${body}</code></pre></div>`;
      }
      function outputBlock(text) {
        return `<div class="output"><div class="output-head">Expected output</div><pre tabindex="0">${esc(text)}</pre></div>`;
      }

      /* ======================= API layer ======================= */
      class ApiError extends Error {
        constructor(status, code, message, fieldErrors) {
          super(message); this.status = status; this.code = code; this.fieldErrors = fieldErrors || null;
        }
      }
      const NETWORK_MSG = 'Cannot reach the server. Check your connection and try again.';
      function defaultMessage(status) {
        if (status === 400) return 'The request was invalid.';
        if (status === 401) return 'Please sign in again.';
        if (status === 403) return 'You do not have permission to do that.';
        if (status === 404) return 'That could not be found.';
        if (status === 409) return 'The data changed at the same moment. Please try again.';
        if (status === 429) return 'Too many requests. Please wait a moment.';
        if (status >= 500) return 'The server had a problem. Please try again shortly.';
        return 'The request failed.';
      }
      const isAuthLost = (e) => e instanceof ApiError && ((e.code || '').startsWith('REFRESH_') || e.code === 'UNAUTHORIZED' || e.code === 'TOKEN_INVALID');
      const isTransient = (e) => e instanceof ApiError && (e.status === 0 || e.status === 408 || e.status === 409 || e.status === 429 || e.status >= 500);

      /**
       * The one function every authenticated request goes through.
       * On a 401 for an expired/invalid access token it refreshes the session (shared by all failing requests)
       * and retries once. If the refresh cannot restore the session, the login screen is shown.
       */
      async function api(path, opts = {}) {
        const { method = 'GET', body, noAuth = false, csrf = false } = opts;

        if (!noAuth && state.token && state.tokenExp && Date.now() > state.tokenExp - 5000) {
          await refreshSession();                                   // avoid a request that is certain to fail
        }

        const headers = { Accept: 'application/json' };
        if (body !== undefined) headers['Content-Type'] = 'application/json';
        if (csrf) headers['X-Requested-With'] = 'codenest';
        if (!noAuth && state.token) headers.Authorization = 'Bearer ' + state.token;

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);
        let res, text = '';
        try {
          res = await fetch(path, { method, headers, credentials: 'same-origin', cache: 'no-store', signal: controller.signal, body: body !== undefined ? JSON.stringify(body) : undefined });
          if (res.status !== 204) text = await res.text();
        } catch (e) {
          throw new ApiError(0, 'NETWORK', NETWORK_MSG);
        } finally { clearTimeout(timer); }

        let data = null;
        if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
        if (res.ok) return data;

        const err = new ApiError(res.status, (data && data.code) || 'HTTP_' + res.status, (data && data.message) || defaultMessage(res.status), data && data.fieldErrors);

        if (res.status === 401 && !noAuth && ['TOKEN_EXPIRED', 'TOKEN_INVALID', 'UNAUTHORIZED'].includes(err.code)) {
          if (!opts._retried) {
            await refreshSession();                                 // throws if the session cannot be restored
            return api(path, Object.assign({}, opts, { _retried: true }));
          }
          endSession({ message: 'Your session could not be verified. Please sign in again. Your progress is saved.', type: 'warn', keepReturn: true });
        }
        throw err;
      }

      /* ----- session ----- */
      let tokenTimer = null, refreshPromise = null;

      function applySession(data) {
        const secs = Number(data.expiresInSeconds) || 900;
        state.token = data.accessToken;
        state.tokenExp = Date.now() + secs * 1000;
        state.user = data.user;
        clearTimeout(tokenTimer);
        tokenTimer = setTimeout(() => { if (state.user) refreshSession().catch(() => {}); }, Math.max(10, secs - 60) * 1000);
        const av = $('#avatar'); if (av && data.user) av.textContent = (data.user.name || '?').trim().charAt(0).toUpperCase();
      }

      /** Only one refresh runs at a time; everybody who needs it waits for the same one. */
      function refreshSession() {
        if (!refreshPromise) refreshPromise = doRefresh().finally(() => { refreshPromise = null; });
        return refreshPromise;
      }
      async function doRefresh() {
        let res, data = null;
        try {
          res = await fetch('/api/auth/refresh', { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'X-Requested-With': 'codenest', Accept: 'application/json' } });
          try { data = await res.json(); } catch (e) { data = null; }
        } catch (e) {
          throw new ApiError(0, 'NETWORK', NETWORK_MSG);
        }
        if (res.ok && data && data.accessToken) { applySession(data); return data; }
        const err = new ApiError(res.status, (data && data.code) || 'HTTP_' + res.status, (data && data.message) || defaultMessage(res.status));
        if ((err.code || '').startsWith('REFRESH_') && state.user) {
          endSession({ message: 'Your session has ended. Please sign in again. Your learning progress is saved.', type: 'warn', keepReturn: true });
        }
        throw err;
      }

      /** Clears credentials only. Learning progress lives in MongoDB and the pending-save outbox is kept. */
      function endSession({ message, type = 'info', keepReturn = false } = {}) {
        clearTimeout(tokenTimer); clearTimeout(flushTimer);
        const hash = location.hash;
        if (keepReturn && hash && !/^#\/(login|register)/.test(hash)) state.returnTo = hash; else if (!keepReturn) state.returnTo = null;
        state.token = null; state.tokenExp = 0; state.user = null; state.shellMounted = false;
        state.flash = message ? { message, type } : null;
        go('/login');
      }

      async function logout() {
        try { await api('/api/auth/logout', { method: 'POST', noAuth: true, csrf: true }); }
        catch (e) { toast('Could not reach the server to sign you out, so you are still signed in. Please try again.', 'error'); return false; }
        endSession({ message: 'You have been signed out. Your learning progress is saved in your account.', type: 'info' });
        return true;
      }

      /** Called once at start-up. Returns "ok", "none" (no valid session) or "offline" (server unreachable). */
      CN.restoreSession = async () => {
        try { await refreshSession(); return 'ok'; }
        catch (err) {
          if ((err.code || '').startsWith('REFRESH_')) return 'none';
          if (err.status === 0 || err.status >= 500) return 'offline';
          return 'none';
        }
      };

      /* ======================= offline-safe saving (pending outbox) ======================= */
      const memQueues = {};
      let inflight = 0, flushing = false, flushAttempts = 0, flushTimer = null;

      const qKey = (uid) => 'codenest.pending.' + (uid || 'anon');
      function loadQueue(uid = state.user && state.user.id) {
        if (!uid) return [];
        try { const raw = localStorage.getItem(qKey(uid)); const q = raw ? JSON.parse(raw) : []; return Array.isArray(q) ? q : []; }
        catch (e) { return memQueues[uid] || []; }
      }
      function saveQueue(q, uid = state.user && state.user.id) {
        if (!uid) return;
        memQueues[uid] = q;
        try { if (q.length) localStorage.setItem(qKey(uid), JSON.stringify(q)); else localStorage.removeItem(qKey(uid)); } catch (e) { /* storage blocked: memory copy only */ }
        updateSyncPill();
      }
      function queueOp(op, uid = state.user && state.user.id) {
        if (!uid) return;
        const q = loadQueue(uid);
        const same = q.find((o) => o.k === op.k && o.lessonId === op.lessonId);
        if (same) {
          if (op.k === 'progress') same.body = Object.assign({}, same.body, op.body);
          else if (op.k === 'bookmark') same.add = op.add;
          same.ts = Date.now();
        } else q.push(Object.assign({}, op, { ts: Date.now() }));
        saveQueue(q, uid);
      }
      function dropQueued(op, uid = state.user && state.user.id) {
        if (!uid) return;
        const q = loadQueue(uid), left = q.filter((o) => !(o.k === op.k && o.lessonId === op.lessonId));
        if (left.length !== q.length) saveQueue(left, uid);
      }
      function removeExact(op, uid) {
        saveQueue(loadQueue(uid).filter((o) => !(o.k === op.k && o.lessonId === op.lessonId && o.ts === op.ts)), uid);
      }

      function execOp(op) {
        const id = enc(op.lessonId);
        if (op.k === 'progress') return api(`/api/lessons/${id}/progress`, { method: 'PUT', body: op.body || {} });
        if (op.k === 'complete') return api(`/api/lessons/${id}/complete`, { method: 'POST' });
        if (op.k === 'bookmark') return api(`/api/bookmarks/${id}`, { method: op.add ? 'PUT' : 'DELETE' });
        return Promise.resolve(null);
      }

      /**
       * Sends one save immediately. Returns { ok:true, data } on success, or { ok:false, queued:true } when the
       * connection or session failed and the change was kept in the outbox for later. It never claims success it did not get.
       */
      async function sendOp(op) {
        const uid = state.user && state.user.id;
        inflight++; updateSyncPill();
        try {
          const data = await execOp(op);
          dropQueued(op, uid);
          return { ok: true, data };
        } catch (err) {
          if (isTransient(err) || isAuthLost(err)) {
            queueOp(op, uid);
            if (!isAuthLost(err)) scheduleFlush();
            return { ok: false, queued: true, error: err };
          }
          throw err;                                                // a real rejection (e.g. the lesson no longer exists)
        } finally { inflight--; updateSyncPill(); }
      }

      async function flushQueue(manual = false) {
        if (flushing || !state.user) return;
        const uid = state.user.id;
        const q = loadQueue(uid);
        if (!q.length) { updateSyncPill(); return; }
        if (manual) flushAttempts = 0;
        flushing = true; updateSyncPill();
        let failed = false;
        try {
          for (const op of q.slice()) {
            try {
              const data = await execOp(op);
              removeExact(op, uid);
              if (op.k === 'complete' && CN.onQueuedComplete) CN.onQueuedComplete(op.lessonId, data);
            } catch (err) {
              if (isTransient(err) || isAuthLost(err)) { failed = true; break; }
              removeExact(op, uid);                                 // permanent error: drop it so it cannot block the queue
            }
          }
        } finally { flushing = false; }
        if (failed) { flushAttempts++; scheduleFlush(); } else flushAttempts = 0;
        updateSyncPill();
        window.dispatchEvent(new CustomEvent('cn:synced'));
      }
      function scheduleFlush() {
        clearTimeout(flushTimer);
        if (!state.user || flushAttempts >= 8) { updateSyncPill(); return; }
        flushTimer = setTimeout(() => flushQueue(), Math.min(60000, 2000 * Math.pow(2, flushAttempts)));
        updateSyncPill();
      }

      function updateSyncPill() {
        const pill = $('#sync-pill'); if (!pill) return;
        const count = state.user ? loadQueue().length : 0;
        let cls = 'pill-ok', text = 'All changes saved', title = 'Everything you did is saved to your account.';
        if (inflight > 0 || flushing) { cls = 'pill-busy'; text = 'Saving…'; title = 'Saving your progress.'; }
        else if (count > 0) {
          cls = 'pill-warn';
          text = flushAttempts >= 8 ? `Sync paused · ${count} unsaved · click to retry`
            : !navigator.onLine ? `Offline · ${count} unsaved` : `Waiting to sync · ${count} unsaved`;
          title = 'Your latest changes are kept on this device and will be sent to your account as soon as the connection works. Click to retry now.';
        }
        pill.className = 'pill ' + cls; pill.textContent = text; pill.title = title;
      }

      const saveProgress = (lessonId, body) => sendOp({ k: 'progress', lessonId, body: body || {} });
      const completeLesson = (lessonId) => sendOp({ k: 'complete', lessonId });
      const setBookmark = (lessonId, add) => sendOp({ k: 'bookmark', lessonId, add: !!add });

      /* ======================= router and shell ======================= */
      const NAV = [['dashboard', 'Dashboard'], ['courses', 'Courses'], ['quizzes', 'Quizzes'], ['practice', 'Practice'], ['bookmarks', 'Bookmarks'], ['progress', 'Progress']];
      const NAV_ALIAS = { course: 'courses', lesson: 'courses', quiz: 'quizzes' };

      function parseHash() {
        const h = location.hash.replace(/^#\/?/, '');
        const [path, query] = h.split('?');
        const parts = path.split('/').filter(Boolean).map((p) => { try { return decodeURIComponent(p); } catch (e) { return p; } });
        return { name: parts[0] || '', args: parts.slice(1), query: new URLSearchParams(query || '') };
      }
      function go(path) {
        const target = '#' + (path.charAt(0) === '/' ? path : '/' + path);
        if (location.hash === target) route(); else location.hash = target;
      }
      const stale = (id) => id !== state.renderId;
      function onLeave(fn) { CN.leave.push(fn); }
      function runLeave() { CN.leave.splice(0).forEach((fn) => { try { fn(); } catch (e) { /* ignore */ } }); }
      function onHide(fn) {
        CN.hooks.hide.push(fn);
        onLeave(() => { const i = CN.hooks.hide.indexOf(fn); if (i >= 0) CN.hooks.hide.splice(i, 1); });
      }
      function runHideHooks() { CN.hooks.hide.slice().forEach((fn) => { try { fn(); } catch (e) { /* ignore */ } }); }

      function mountShell() {
        if (state.shellMounted && $('#view')) return;
        const u = state.user;
        const links = NAV.concat(u.role === 'ADMIN' ? [['admin', 'Admin']] : [])
          .map(([k, l]) => `<a href="#/${k}" data-nav="${k}">${l}</a>`).join('');
        $('#app').innerHTML = `
          <header class="topbar" id="topbar">
            <button type="button" class="skip-link" data-action="skip">Skip to content</button>
            <a class="brand" href="#/dashboard"><span class="logo">${LOGO}</span><span>CodeNest</span></a>
            <nav class="nav" id="nav" aria-label="Main">${links}</nav>
            <div class="topbar-right">
              <button type="button" id="sync-pill" class="pill pill-ok" data-action="retry-sync" aria-live="polite">All changes saved</button>
              <a class="avatar" id="avatar" href="#/profile" title="Your profile" aria-label="Your profile">${esc((u.name || '?').trim().charAt(0).toUpperCase())}</a>
              <button type="button" class="btn btn-ghost btn-sm" data-action="logout">Log out</button>
              <button type="button" class="nav-toggle icon-btn" data-action="toggle-nav" aria-label="Menu" aria-expanded="false">${icon('menu', 22)}</button>
            </div>
          </header>
          <main id="view" class="container" tabindex="-1"></main>`;
        state.shellMounted = true;
        updateSyncPill();
      }
      function mountGuest(inner) {
        state.shellMounted = false;
        $('#app').innerHTML = `<div class="auth-wrap"><div class="auth-card">
          <a class="auth-brand" href="#/login"><span class="logo">${LOGO}</span><span>CodeNest</span></a>${inner}</div>
          <p class="auth-foot muted small">Learn Java, one lesson at a time.</p></div>`;
      }
      function setActiveNav(name) {
        const key = Object.prototype.hasOwnProperty.call(NAV_ALIAS, name) ? NAV_ALIAS[name] : name;
        $$('[data-nav]').forEach((a) => { const on = a.dataset.nav === key; a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      }

      async function route() {
        runLeave();
        const r = parseHash();
        CN.current = r;
        const guestRoute = r.name === 'login' || r.name === 'register';

        if (!state.user) {
          if (!guestRoute) { if (location.hash && location.hash !== '#/' && location.hash !== '#') state.returnTo = location.hash; return go('/login'); }
        } else if (guestRoute || r.name === '') {
          return go('/dashboard');
        }

        const id = ++state.renderId;
        if (state.user) {
          mountShell(); setActiveNav(r.name);
          const tb = $('#topbar'); if (tb) { tb.classList.remove('nav-open'); const t = $('.nav-toggle', tb); if (t) t.setAttribute('aria-expanded', 'false'); }
        }
        const handler = CN.routes[r.name];
        if (!handler) { if (state.user) setView(notFoundHtml()); return; }

        window.scrollTo(0, 0);
        if (state.user) setView(loadingHtml());
        try { await handler(r.args, id, r); }
        catch (err) { if (!stale(id) && state.user) setView(errorHtml(err)); }
        if (!stale(id) && state.user) { const v = view(); if (v) v.focus({ preventScroll: true }); }
      }

      let routerStarted = false;
      CN.startRouter = () => { if (!routerStarted) { window.addEventListener('hashchange', route); routerStarted = true; } route(); };

      /** Called by the login and registration screens after a session has been applied. */
      CN.finishLogin = () => {
        state.flash = null; flushAttempts = 0;
        let target = state.returnTo; state.returnTo = null;
        if (!target || /^#\/(login|register)/.test(target)) target = '#/dashboard';
        mountShell();
        flushQueue();
        go(target.replace(/^#/, ''));
      };
      /** Called by start-up when a session was restored from the refresh cookie. */
      CN.afterRestore = () => { flushAttempts = 0; mountShell(); flushQueue(); };

      /* ======================= global events and built-in actions ======================= */
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]'); if (!el) return;
        const fn = CN.actions[el.dataset.action]; if (fn) fn(el, e);
      });
      document.addEventListener('submit', (e) => {
        const form = e.target.closest('form[data-form]'); if (!form) return;
        e.preventDefault();
        const fn = CN.forms[form.dataset.form]; if (fn) fn(form, e);
      });

      function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove(); return ok;
      }
      Object.assign(CN.actions, {
        'retry-route': () => route(),
        'retry-sync': () => flushQueue(true),
        'skip': () => { const v = view(); if (v) v.focus(); },
        'toggle-nav': (btn) => {
          const tb = $('#topbar'); const open = tb.classList.toggle('nav-open');
          btn.setAttribute('aria-expanded', String(open));
        },
        'logout': async (btn) => { setBusy(btn, true, 'Signing out…'); const ok = await logout(); if (!ok) setBusy(btn, false); },
        'copy-code': async (btn) => {
          const code = btn.closest('.code').querySelector('code').textContent;
          let ok = true;
          try { await navigator.clipboard.writeText(code); } catch (e) { ok = legacyCopy(code); }
          if (!ok) { toast('Could not copy automatically. Select the code and press Ctrl+C.', 'error'); return; }
          const old = btn.innerHTML; btn.innerHTML = icon('check', 14) + ' Copied';
          setTimeout(() => { btn.innerHTML = old; }, 1600);
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') runHideHooks();
        else if (state.user) {
          if (state.tokenExp - Date.now() < 60000) refreshSession().catch(() => {});
          flushQueue();
        }
      });
      window.addEventListener('pagehide', runHideHooks);
      window.addEventListener('online', () => { flushAttempts = 0; flushQueue(); updateSyncPill(); });
      window.addEventListener('offline', updateSyncPill);

      /* ======================= public surface for the other script blocks ======================= */
      Object.assign(CN, {
        esc, enc, $, $$, uuid, fmtDate, fmtDateTime, relTime, debounce, throttle, paragraphs, icon, LOGO,
        toast, openModal, confirmDialog, setBusy, view, setView, setTitle, loadingHtml, errorHtml, emptyHtml, errMsg,
        ring, bar, codeBlock, outputBlock, ApiError, api, isTransient, sendOp, queueOp, flushQueue,
        saveProgress, completeLesson, setBookmark, go, parseHash, mountGuest, applySession, logout,
        onLeave, onHide, stale
      });
    })();
</script>

<!-- ================================================================================
