<script>
    (() => {
      'use strict';
      const CN = window.CN;
      const { state, esc, enc, $, $$, icon, toast, setBusy, setView, setTitle, api, stale, openModal, confirmDialog, emptyHtml, errMsg } = CN;

      const SECTIONS = [['overview', 'Overview'], ['courses', 'Courses'], ['modules', 'Modules'], ['lessons', 'Lessons'], ['quizzes', 'Quizzes'], ['practice', 'Practice']];
      const ctx = { section: 'overview', items: new Map(), courses: [], modules: [], courseId: null, renderId: 0 };

      const val = (v) => (v == null ? '' : String(v));
      const input = (name, label, v, extra = '') => `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="text" value="${esc(val(v))}" ${extra}></div>`;
      const number = (name, label, v, extra = '') => `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="number" value="${esc(val(v))}" ${extra}></div>`;
      const area = (name, label, v, rows = 3, mono = false, hint = '') => `<div class="field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" rows="${rows}" class="${mono ? 'mono' : ''}">${esc(val(v))}</textarea>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
      const check = (name, label, on) => `<div class="field"><label class="check"><input type="checkbox" name="${name}" ${on ? 'checked' : ''}> ${label}</label></div>`;
      const lines = (arr) => (arr || []).join('\n');
      const splitLines = (text) => String(text || '').split('\n').map((s) => s.trim()).filter(Boolean);
      const fv = (form, name) => form.elements.namedItem(name).value;
      const k = (el, key) => { const n = $(`[data-k="${key}"]`, el); return n ? n.value : ''; };

      function need(text, label, max) {
        const t = String(text || '').trim();
        if (!t) throw new Error(label + ' is required.');
        if (max && t.length > max) throw new Error(`${label} must be at most ${max} characters.`);
        return t;
      }
      const intIn = (v, label, min, max) => {
        const n = Number(v);
        if (v === '' || !Number.isInteger(n) || n < min || (max != null && n > max)) throw new Error(`${label} must be a whole number${max != null ? ` from ${min} to ${max}` : ` of ${min} or more`}.`);
        return n;
      };

      /* ----- a modal that holds one form ----- */
      function formModal({ title, fields, wide = false, onSubmit, onMount }) {
        const m = openModal({ title, wide, html: `<form id="admin-form" novalidate>
          <div class="flash flash-error hidden" data-msg role="alert"></div>${fields}
          <div class="modal-foot"><button type="button" class="btn btn-ghost" data-modal-close>Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form>` });
        const form = $('#admin-form', m.body);
        const msg = $('[data-msg]', form);
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          msg.className = 'flash flash-error hidden';
          const btn = $('button[type=submit]', form);
          setBusy(btn, true, 'Saving…');
          try {
            await onSubmit(form);
            m.close(); toast('Saved', 'success'); reload();
          } catch (err) {
            setBusy(btn, false);
            msg.className = 'flash flash-error'; msg.textContent = errMsg(err); msg.scrollIntoView({ block: 'nearest' });
          }
        });
        if (onMount) onMount(form);
        return m;
      }

      /* ----- course / module / lesson scope selects (used by quizzes and practice) ----- */
      function scopeFields() {
        return `<div class="form-grid">
          <div class="field"><label for="f-courseId">Course</label><select id="f-courseId" name="courseId">${ctx.courses.map((c) => `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('')}</select></div>
          <div class="field"><label for="f-moduleId">Module (optional)</label><select id="f-moduleId" name="moduleId"><option value="">Whole course</option></select></div>
          <div class="field full"><label for="f-lessonId">Lesson (optional)</label><select id="f-lessonId" name="lessonId"><option value="">None</option></select></div></div>`;
      }
      async function wireScope(form, item) {
        const cs = form.elements.namedItem('courseId'), ms = form.elements.namedItem('moduleId'), ls = form.elements.namedItem('lessonId');
        let modules = [], lessons = [];
        const fillLessons = () => {
          const m = ms.value;
          ls.innerHTML = '<option value="">None</option>' + lessons.filter((l) => !m || l.moduleId === m).map((l) => `<option value="${esc(l.id)}">${esc(l.title)}</option>`).join('');
        };
        const load = async (courseId, sel) => {
          [modules, lessons] = await Promise.all([api(`/api/admin/courses/${enc(courseId)}/modules`), api(`/api/admin/courses/${enc(courseId)}/lessons`)]);
          ms.innerHTML = '<option value="">Whole course</option>' + modules.map((x) => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');
          if (sel && sel.moduleId) ms.value = sel.moduleId;
          fillLessons();
          if (sel && sel.lessonId) ls.value = sel.lessonId;
        };
        if (item) cs.value = item.courseId; else if (ctx.courseId) cs.value = ctx.courseId;
        try { await load(cs.value, item); } catch (err) { toast(errMsg(err), 'error'); }
        cs.addEventListener('change', () => load(cs.value, null).catch((e) => toast(errMsg(e), 'error')));
        ms.addEventListener('change', fillLessons);
      }

      /* ----- repeaters (lesson examples and quiz questions) ----- */
      const exampleItem = (e = {}) => `<div class="repeater-item" data-example>
        <div class="field"><label>Title</label><input type="text" data-k="title" value="${esc(val(e.title))}"></div>
        <div class="field"><label>Code</label><textarea class="mono" rows="7" data-k="code">${esc(val(e.code))}</textarea></div>
        <div class="field"><label>Expected output</label><textarea class="mono" rows="3" data-k="expectedOutput">${esc(val(e.expectedOutput))}</textarea></div>
        <button type="button" class="btn btn-danger btn-sm" data-remove>${icon('trash', 14)} Remove example</button></div>`;
      const questionItem = (q = {}) => `<div class="repeater-item" data-question>
        <div class="field"><label>Question</label><textarea rows="2" data-k="text">${esc(val(q.text))}</textarea></div>
        <div class="field"><label>Answer options (one per line, 2 to 6)</label><textarea rows="4" data-k="options">${esc(lines(q.options))}</textarea></div>
        <div class="field"><label>Number of the correct option (1 = first line)</label><input type="number" min="1" max="6" data-k="correct" value="${q.correctIndex != null ? q.correctIndex + 1 : ''}"></div>
        <div class="field"><label>Explanation (shown after submitting)</label><textarea rows="2" data-k="explanation">${esc(val(q.explanation))}</textarea></div>
        <button type="button" class="btn btn-danger btn-sm" data-remove>${icon('trash', 14)} Remove question</button></div>`;
      function wireRepeaters(form, addSelector, containerId, itemFn) {
        form.addEventListener('click', (e) => {
          if (e.target.closest(addSelector)) { $(containerId, form).insertAdjacentHTML('beforeend', itemFn()); return; }
          const rm = e.target.closest('[data-remove]'); if (rm) rm.closest('.repeater-item').remove();
        });
      }

      /* ============================================================================
         FORMS
         ============================================================================ */
      function formCourse(item) {
        formModal({
          title: item ? 'Edit course' : 'New course',
          fields: input('title', 'Title', item && item.title, 'maxlength="120"') + area('description', 'Description', item && item.description, 3) +
            `<div class="form-grid">${input('level', 'Level', item && item.level, 'maxlength="40" placeholder="Beginner"')}${number('orderIndex', 'Order', item ? item.orderIndex : 1, 'min="0"')}</div>` +
            check('published', 'Published (visible to students)', item ? item.published : true),
          onSubmit: async (f) => {
            const body = { title: need(fv(f, 'title'), 'Title', 120), description: fv(f, 'description').trim(), level: fv(f, 'level').trim(),
              orderIndex: intIn(fv(f, 'orderIndex'), 'Order', 0), published: f.elements.published.checked };
            await api(item ? `/api/admin/courses/${enc(item.id)}` : '/api/admin/courses', { method: item ? 'PUT' : 'POST', body });
          }
        });
      }

      function formModule(item) {
        const courseSel = `<div class="field"><label for="f-courseId">Course</label><select id="f-courseId" name="courseId" ${item ? 'disabled' : ''}>${ctx.courses.map((c) => `<option value="${esc(c.id)}" ${c.id === (item ? item.courseId : ctx.courseId) ? 'selected' : ''}>${esc(c.title)}</option>`).join('')}</select></div>`;
        formModal({
          title: item ? 'Edit module' : 'New module',
          fields: courseSel + input('title', 'Title', item && item.title, 'maxlength="120"') + area('description', 'Description', item && item.description, 3) + number('orderIndex', 'Order', item ? item.orderIndex : ctx.items.size + 1, 'min="0"'),
          onSubmit: async (f) => {
            const body = { courseId: item ? item.courseId : fv(f, 'courseId'), title: need(fv(f, 'title'), 'Title', 120), description: fv(f, 'description').trim(), orderIndex: intIn(fv(f, 'orderIndex'), 'Order', 0) };
            await api(item ? `/api/admin/modules/${enc(item.id)}` : '/api/admin/modules', { method: item ? 'PUT' : 'POST', body });
          }
        });
      }

      function formLesson(item) {
        const moduleSel = `<div class="field"><label for="f-moduleId">Module</label><select id="f-moduleId" name="moduleId">${ctx.modules.map((m) => `<option value="${esc(m.id)}" ${item && item.moduleId === m.id ? 'selected' : ''}>${esc(m.title)}</option>`).join('')}</select></div>`;
        formModal({
          title: item ? 'Edit lesson' : 'New lesson', wide: true,
          fields: `<div class="form-grid">${moduleSel}${input('title', 'Title', item && item.title, 'maxlength="150"')}
            ${number('orderIndex', 'Order within the module', item ? item.orderIndex : 1, 'min="0"')}${number('estimatedMinutes', 'Estimated minutes', item ? item.estimatedMinutes : 10, 'min="1" max="600"')}</div>` +
            area('objectives', 'Learning objectives', lines(item && item.objectives), 3, false, 'One per line.') +
            area('explanation', 'Explanation', item && item.explanation, 10, false, 'Plain text. Separate paragraphs with a blank line. HTML is not interpreted.') +
            `<div class="label">Code examples</div><div id="examples">${((item && item.examples) || []).map(exampleItem).join('')}</div>
             <p><button type="button" class="btn btn-ghost btn-sm" data-add-example>${icon('plus', 14)} Add example</button></p>` +
            area('importantNotes', 'Important notes', lines(item && item.importantNotes), 3, false, 'One per line.') +
            area('commonMistakes', 'Common mistakes', lines(item && item.commonMistakes), 3, false, 'One per line.') +
            area('relatedTopics', 'Related topics', lines(item && item.relatedTopics), 2, false, 'One per line.') +
            `<div class="form-grid">${input('youtubeUrl', 'YouTube link or video ID', item && item.youtubeVideoId, 'placeholder="https://www.youtube.com/watch?v=..."')}${input('videoTitle', 'Video title', item && item.videoTitle, 'maxlength="200"')}</div>` +
            check('published', 'Published (visible to students)', item ? item.published : true),
          onMount: (form) => wireRepeaters(form, '[data-add-example]', '#examples', exampleItem),
          onSubmit: async (f) => {
            const examples = $$('[data-example]', f).map((el) => ({ title: k(el, 'title').trim(), code: k(el, 'code'), expectedOutput: k(el, 'expectedOutput').trim() })).filter((e) => e.code.trim());
            const body = { courseId: ctx.courseId, moduleId: need(fv(f, 'moduleId'), 'Module'), title: need(fv(f, 'title'), 'Title', 150),
              orderIndex: intIn(fv(f, 'orderIndex'), 'Order', 0), estimatedMinutes: intIn(fv(f, 'estimatedMinutes'), 'Estimated minutes', 1, 600),
              objectives: splitLines(fv(f, 'objectives')), explanation: need(fv(f, 'explanation'), 'Explanation', 50000), examples,
              importantNotes: splitLines(fv(f, 'importantNotes')), commonMistakes: splitLines(fv(f, 'commonMistakes')), relatedTopics: splitLines(fv(f, 'relatedTopics')),
              youtubeUrl: fv(f, 'youtubeUrl').trim(), videoTitle: fv(f, 'videoTitle').trim(), published: f.elements.published.checked };
            await api(item ? `/api/admin/lessons/${enc(item.id)}` : '/api/admin/lessons', { method: item ? 'PUT' : 'POST', body });
          }
        });
      }

      function formQuiz(item) {
        formModal({
          title: item ? 'Edit quiz' : 'New quiz', wide: true,
          fields: scopeFields() + input('title', 'Title', item && item.title, 'maxlength="150"') + area('description', 'Description', item && item.description, 2) +
            number('passingPercent', 'Passing score (%)', item ? item.passingPercent : 60, 'min="1" max="100"') +
            `<div class="label">Questions</div><div id="questions">${((item && item.questions) || [{}]).map(questionItem).join('')}</div>
             <p><button type="button" class="btn btn-ghost btn-sm" data-add-question>${icon('plus', 14)} Add question</button></p>` +
            check('published', 'Published (visible to students)', item ? item.published : true),
          onMount: (form) => { wireScope(form, item); wireRepeaters(form, '[data-add-question]', '#questions', questionItem); },
          onSubmit: async (f) => {
            const questions = $$('[data-question]', f).map((el, i) => {
              const options = splitLines(k(el, 'options'));
              if (options.length < 2 || options.length > 6) throw new Error(`Question ${i + 1}: enter 2 to 6 answer options, one per line.`);
              const correct = Number(k(el, 'correct'));
              if (!Number.isInteger(correct) || correct < 1 || correct > options.length) throw new Error(`Question ${i + 1}: the correct option number must be between 1 and ${options.length}.`);
              return { text: need(k(el, 'text'), `Question ${i + 1} text`, 1000), options, correctIndex: correct - 1, explanation: k(el, 'explanation').trim() };
            });
            if (!questions.length) throw new Error('Add at least one question.');
            const body = { courseId: fv(f, 'courseId'), moduleId: fv(f, 'moduleId'), lessonId: fv(f, 'lessonId'), title: need(fv(f, 'title'), 'Title', 150),
              description: fv(f, 'description').trim(), passingPercent: intIn(fv(f, 'passingPercent'), 'Passing score', 1, 100), questions, published: f.elements.published.checked };
            await api(item ? `/api/admin/quizzes/${enc(item.id)}` : '/api/admin/quizzes', { method: item ? 'PUT' : 'POST', body });
          }
        });
      }

      function formPractice(item) {
        const diff = ['EASY', 'MEDIUM', 'HARD'].map((d) => `<option value="${d}" ${item && item.difficulty === d ? 'selected' : ''}>${d}</option>`).join('');
        formModal({
          title: item ? 'Edit practice question' : 'New practice question', wide: true,
          fields: scopeFields() + input('title', 'Title', item && item.title, 'maxlength="150"') +
            `<div class="field"><label for="f-difficulty">Difficulty</label><select id="f-difficulty" name="difficulty">${diff}</select></div>` +
            area('description', 'Task description', item && item.description, 4) + area('starterCode', 'Starter code', item && item.starterCode, 6, true) +
            area('hint', 'Hint', item && item.hint, 2) + area('referenceSolution', 'Reference solution', item && item.referenceSolution, 8, true) +
            area('expectedOutput', 'Expected output', item && item.expectedOutput, 3, true) + check('published', 'Published (visible to students)', item ? item.published : true),
          onMount: (form) => wireScope(form, item),
          onSubmit: async (f) => {
            const body = { courseId: fv(f, 'courseId'), moduleId: fv(f, 'moduleId'), lessonId: fv(f, 'lessonId'), title: need(fv(f, 'title'), 'Title', 150),
              description: need(fv(f, 'description'), 'Task description', 5000), difficulty: fv(f, 'difficulty'), starterCode: fv(f, 'starterCode'), hint: fv(f, 'hint').trim(),
              referenceSolution: need(fv(f, 'referenceSolution'), 'Reference solution', 20000), expectedOutput: fv(f, 'expectedOutput').trim(), published: f.elements.published.checked };
            await api(item ? `/api/admin/practice/${enc(item.id)}` : '/api/admin/practice', { method: item ? 'PUT' : 'POST', body });
          }
        });
      }

      const FORMS = { courses: formCourse, modules: formModule, lessons: formLesson, quizzes: formQuiz, practice: formPractice };
      const DELETE_URL = { courses: '/api/admin/courses/', modules: '/api/admin/modules/', lessons: '/api/admin/lessons/', quizzes: '/api/admin/quizzes/', practice: '/api/admin/practice/' };
      const DELETE_WARN = {
        courses: 'This also deletes the course\'s modules, lessons, quizzes and practice questions.',
        modules: 'This also deletes the module\'s lessons, quizzes and practice questions.',
        lessons: 'This also deletes the quizzes and practice questions attached to this lesson.',
        quizzes: 'Past quiz results stay in students\' history.', practice: ''
      };

      CN.actions['admin-new'] = () => FORMS[ctx.section](null);
      CN.actions['admin-edit'] = (el) => { const item = ctx.items.get(el.dataset.id); if (item) FORMS[ctx.section](item); };
      CN.actions['admin-delete'] = async (el) => {
        const item = ctx.items.get(el.dataset.id); if (!item) return;
        const ok = await confirmDialog(`Delete "${item.title}"? ${DELETE_WARN[ctx.section]} Students' saved progress is not removed. This cannot be undone.`, { title: 'Delete permanently?', okText: 'Delete', danger: true });
        if (!ok) return;
        setBusy(el, true, 'Deleting…');
        try { await api(DELETE_URL[ctx.section] + enc(item.id), { method: 'DELETE' }); toast('Deleted', 'success'); reload(); }
        catch (err) { setBusy(el, false); toast(errMsg(err), 'error'); }
      };

      document.addEventListener('change', (e) => {
        const sel = e.target.closest('[data-admin-course]'); if (!sel) return;
        CN.go(`/admin/${ctx.section}?courseId=${enc(sel.value)}`);
      });

      /* ============================================================================
         SECTIONS
         ============================================================================ */
      const rowActions = (id) => `<div class="row" style="flex-wrap:nowrap"><button type="button" class="btn btn-ghost btn-sm" data-action="admin-edit" data-id="${esc(id)}">${icon('edit', 14)} Edit</button><button type="button" class="btn btn-danger btn-sm" data-action="admin-delete" data-id="${esc(id)}">${icon('trash', 14)} Delete</button></div>`;
      const yesNo = (b) => `<span class="badge ${b ? 'badge-ok' : 'badge-warn'}">${b ? 'Published' : 'Draft'}</span>`;
      const tableHtml = (heads, rows) => `<div class="table-wrap"><table class="table"><thead><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
      const toolbar = (title, newLabel, extra = '') => `<div class="toolbar"><h2 class="mb0">${title}</h2><div class="row">${extra}<button type="button" class="btn btn-primary" data-action="admin-new">${icon('plus', 16)} ${newLabel}</button></div></div>`;
      const courseSelect = () => `<select class="input" style="width:auto" data-admin-course aria-label="Course">${ctx.courses.map((c) => `<option value="${esc(c.id)}" ${c.id === ctx.courseId ? 'selected' : ''}>${esc(c.title)}</option>`).join('')}</select>`;
      const needCourse = () => emptyHtml('Create a course first', 'Modules, lessons, quizzes and practice questions belong to a course.', '<a class="btn btn-primary" href="#/admin/courses">Go to courses</a>');
      const cname = (id) => (ctx.courses.find((c) => c.id === id) || {}).title || '';

      async function sectionHtml() {
        ctx.items = new Map();
        switch (ctx.section) {
          case 'overview': {
            const s = await api('/api/admin/stats');
            const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
            return `<div class="grid grid-4">${stat(s.users, 'Users')}${stat(s.students, 'Students')}${stat(s.admins, 'Administrators')}${stat(s.courses, 'Courses')}
              ${stat(s.modules, 'Modules')}${stat(s.lessons, 'Lessons')}${stat(s.quizzes, 'Quizzes')}${stat(s.practiceQuestions, 'Practice questions')}
              ${stat(s.quizAttempts, 'Quiz attempts')}${stat(s.lessonCompletions, 'Lesson completions')}</div>
              <p class="muted mt">Deleting content never deletes students' saved progress, bookmarks, quiz history or achievements.</p>`;
          }
          case 'courses': {
            ctx.courses.forEach((c) => ctx.items.set(c.id, c));
            const rows = ctx.courses.map((c) => `<tr><td><b>${esc(c.title)}</b><div class="small muted">${esc(c.description || '')}</div></td><td>${esc(c.level || '')}</td><td>${c.orderIndex}</td><td>${yesNo(c.published)}</td><td>${rowActions(c.id)}</td></tr>`).join('');
            return toolbar('Courses', 'New course') + (rows ? tableHtml(['Course', 'Level', 'Order', 'Status', ''], rows) : emptyHtml('No courses yet', 'Create your first course.'));
          }
          case 'modules': {
            if (!ctx.courseId) return needCourse();
            const list = await api(`/api/admin/courses/${enc(ctx.courseId)}/modules`);
            list.forEach((m) => ctx.items.set(m.id, m)); ctx.items.size;
            const rows = list.map((m) => `<tr><td><b>${esc(m.title)}</b><div class="small muted">${esc(m.description || '')}</div></td><td>${m.orderIndex}</td><td>${rowActions(m.id)}</td></tr>`).join('');
            return toolbar('Modules', 'New module', courseSelect()) + (rows ? tableHtml(['Module', 'Order', ''], rows) : emptyHtml('No modules in this course', 'Create a module to hold lessons.'));
          }
          case 'lessons': {
            if (!ctx.courseId) return needCourse();
            const [mods, list] = await Promise.all([api(`/api/admin/courses/${enc(ctx.courseId)}/modules`), api(`/api/admin/courses/${enc(ctx.courseId)}/lessons`)]);
            ctx.modules = mods; list.forEach((l) => ctx.items.set(l.id, l));
            const mname = new Map(mods.map((m) => [m.id, m.title]));
            const rows = list.slice().sort((a, b) => (mname.get(a.moduleId) || '').localeCompare(mname.get(b.moduleId) || '') || a.orderIndex - b.orderIndex)
              .map((l) => `<tr><td><b>${esc(l.title)}</b></td><td>${esc(mname.get(l.moduleId) || '')}</td><td>${l.orderIndex}</td><td>${l.youtubeVideoId ? '<span class="badge badge-accent">Video</span>' : ''}</td><td>${yesNo(l.published)}</td><td>${rowActions(l.id)}</td></tr>`).join('');
            const head = toolbar('Lessons', 'New lesson', courseSelect());
            if (!mods.length) return head + emptyHtml('Create a module first', 'Lessons live inside modules.', '<a class="btn btn-primary" href="#/admin/modules?courseId=' + enc(ctx.courseId) + '">Go to modules</a>');
            return head + (rows ? tableHtml(['Lesson', 'Module', 'Order', 'Video', 'Status', ''], rows) : emptyHtml('No lessons in this course', 'Create the first lesson.'));
          }
          case 'quizzes': {
            if (!ctx.courses.length) return needCourse();
            const list = await api('/api/admin/quizzes');
            list.forEach((q) => ctx.items.set(q.id, q));
            const rows = list.map((q) => `<tr><td><b>${esc(q.title)}</b></td><td>${esc(cname(q.courseId))}</td><td>${(q.questions || []).length}</td><td>${q.passingPercent}%</td><td>${yesNo(q.published)}</td><td>${rowActions(q.id)}</td></tr>`).join('');
            return toolbar('Quizzes', 'New quiz') + (rows ? tableHtml(['Quiz', 'Course', 'Questions', 'Pass mark', 'Status', ''], rows) : emptyHtml('No quizzes yet', 'Create the first quiz.'));
          }
          case 'practice': {
            if (!ctx.courses.length) return needCourse();
            const list = await api('/api/admin/practice');
            list.forEach((p) => ctx.items.set(p.id, p));
            const rows = list.map((p) => `<tr><td><b>${esc(p.title)}</b></td><td>${esc(cname(p.courseId))}</td><td><span class="diff-${esc(p.difficulty)}">${esc(p.difficulty)}</span></td><td>${yesNo(p.published)}</td><td>${rowActions(p.id)}</td></tr>`).join('');
            return toolbar('Practice questions', 'New question') + (rows ? tableHtml(['Question', 'Course', 'Difficulty', 'Status', ''], rows) : emptyHtml('No practice questions yet', 'Create the first one.'));
          }
          default: return '';
        }
      }

      async function reload() {
        const body = $('#admin-body'); if (!body) return;
        const id = ctx.renderId;
        try {
          ctx.courses = await api('/api/admin/courses');
          if (!ctx.courses.some((c) => c.id === ctx.courseId)) ctx.courseId = ctx.courses[0] ? ctx.courses[0].id : null;
          const html = await sectionHtml();
          if (!stale(id) && $('#admin-body')) $('#admin-body').innerHTML = html;
        } catch (err) { if (!stale(id) && $('#admin-body')) $('#admin-body').innerHTML = CN.errorHtml(err); }
      }

      CN.routes.admin = async (args, id, r) => {
        setTitle('Admin');
        if (!state.user || state.user.role !== 'ADMIN') {
          setView(emptyHtml('Administrators only', 'You do not have access to this area.', '<a class="btn btn-primary" href="#/dashboard">Back to dashboard</a>')); return;
        }
        ctx.section = SECTIONS.some((s) => s[0] === args[0]) ? args[0] : 'overview';
        ctx.renderId = id;
        ctx.courseId = r.query.get('courseId') || ctx.courseId;
        const tabs = SECTIONS.map(([key, label]) => `<a class="tab" role="tab" aria-selected="${key === ctx.section}" href="#/admin/${key}${ctx.courseId && (key === 'modules' || key === 'lessons') ? '?courseId=' + enc(ctx.courseId) : ''}" style="text-decoration:none">${label}</a>`).join('');
        setView(`<div class="page-head"><div><h1>Admin dashboard</h1><p class="muted">Manage the curriculum. Every change is checked again by the server.</p></div></div>
          <div class="tabs" role="tablist" aria-label="Admin sections">${tabs}</div><div id="admin-body">${CN.loadingHtml()}</div>`);
        await reload();
      };
    })();
</script>

<!-- ================================================================================
     SCRIPT 5 OF 5: START-UP
     Restores the session from the refresh cookie, then loads the saved learning state from MongoDB.
     ================================================================================ -->
<script>
    (() => {
      'use strict';
      const CN = window.CN;
      const app = document.getElementById('app');

      async function boot() {
        app.innerHTML = '<div class="boot"><div class="spinner big"></div><p>Loading CodeNest…</p></div>';
        const result = await CN.restoreSession();           // "ok", "none" (not signed in) or "offline"
        if (result === 'offline') {
          app.innerHTML = `<div class="auth-wrap"><div class="auth-card center">
            <h1>Cannot reach CodeNest</h1>
            <p class="muted">The server or its database is not responding. Your learning progress is safe in your account. Check that the backend and MongoDB are running, then try again.</p>
            <button type="button" class="btn btn-primary" id="retry-boot">Try again</button></div></div>`;
          document.getElementById('retry-boot').addEventListener('click', boot);
          return;
        }
        if (result === 'ok') CN.afterRestore();
        CN.startRouter();
      }
      boot();
    })();
</script>
